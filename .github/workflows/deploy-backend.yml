name: Deploy AutoGrader backend

on:
  push:
    branches:
      - main
    paths:
      - "B1/contracts.lock"
      - "B1/module.yaml"
      - "B2/alembic/**"
      - "B2/alembic.ini"
      - "B2/contracts.lock"
      - "B2/module.yaml"
      - "B2/pyproject.toml"
      - "B2/src/**"
      - "B3/alembic/**"
      - "B3/alembic.ini"
      - "B3/contracts.lock"
      - "B3/module.yaml"
      - "B3/pyproject.toml"
      - "B3/src/**"
      - "B4/alembic/**"
      - "B4/alembic.ini"
      - "B4/contracts.lock"
      - "B4/module.yaml"
      - "B4/pyproject.toml"
      - "B4/src/**"
      - "B5/module.yaml"
      - "B5/contracts.lock"
      - "B5/pyproject.toml"
      - "B5/src/**"
      - "MAIN/contracts/**"
      - "MAIN/host/src/**"
      - "MAIN/host/pyproject.toml"
      - "MAIN/infra/postgres/**"
      - "MAIN/compose.production.yaml"
      - "MAIN/pyproject.toml"
      - "MAIN/sdk/src/**"
      - "MAIN/scripts/production-prepare.sh"
      - "MAIN/uv.lock"
      - "MAIN/scripts/production-preflight.sh"
      - "MAIN/deploy/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/scripts/deploy-ssh.sh"
  workflow_dispatch:
    inputs:
      operation:
        description: "Prepare host configuration, inspect the server, or deploy this revision"
        required: true
        type: choice
        options:
          - bootstrap-host
          - sync-mail-channel
          - sync-llm-config
          - preflight
          - diagnose
          - check-mail
          - deploy
        default: preflight

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.1
          enable-cache: true
          cache-dependency-glob: MAIN/uv.lock
      - name: Install the backend workspace
        run: uv sync --project MAIN --all-groups --extra modules --locked
      - name: Lint backend code
        run: uv run --project MAIN --locked ruff check MAIN/host MAIN/sdk MAIN/deploy/check-readiness.py B2/src B3/src B4/src B5/src
      - name: Check host and deployment health contract
        run: uv run --project MAIN --locked pytest MAIN/host/tests -q
      - name: Check cgroup failure handling
        working-directory: B2
        env:
          DATABASE_URL: ""
          B2_TEST_DATABASE_URL: ""
        run: |
          ../MAIN/.venv/bin/python -m pytest -q \
            tests/test_runner_core.py::TestNoDegradation \
            tests/test_security_decision.py::TestRuleTable::test_ssh_is_not_statically_blocked_but_external_clients_remain_blocked \
            tests/test_runner_core.py::test_sandbox_gate_serializes_separate_processes \
            tests/test_runner_core.py::TestBuildArgv::test_launcher_passes_list_argv_and_no_shell \
            tests/test_integration_adapters.py::TestWorkspaceProvider::test_case_workspace_is_accessible_without_exposing_its_parent \
            tests/test_runner_core.py::TestAdapters::test_single_submission_uses_the_declared_entry \
            tests/test_runner_core.py::TestNsjailConfig::test_unprivileged_maps_use_delegated_ids_and_helpers \
            tests/test_runner_core.py::TestNsjailConfig::test_kafel_policy_uses_file_level_default_action \
            tests/test_runner_core.py::TestNsjailConfig::test_seccomp_covers_measured_cpython_syscalls \
            tests/test_runner_core.py::TestEvidence::test_nsjail_cgroup_setup_failure_is_sandbox_unavailable \
            tests/test_runner_core.py::TestEvidence::test_student_exit_255_and_forged_stderr_are_not_sandbox_setup_failure \
            tests/test_runner_core.py::TestEvidence::test_failed_case_does_not_log_student_stderr \
            tests/test_reference_verification.py::test_cgroup_launch_failure_reaches_reference_api_without_attestation \
            tests/test_case_evidence_details.py::test_canary_does_not_report_cgroup_initialization_failure_as_blocked
          ../MAIN/.venv/bin/python -m pytest -q tests/test_intake_directory_matcher.py
          ../MAIN/.venv/bin/python -m pytest -q tests/test_email_intake.py::test_mail_puller_uses_b2_scoped_database_configuration
      - name: Check deployment shell syntax
        run: |
          for script in MAIN/deploy/*.sh MAIN/deploy/autograder-deployctl MAIN/scripts/production-*.sh .github/scripts/deploy-ssh.sh; do
            bash -n "$script"
          done
      - name: Check mail configuration
        run: node --test MAIN/deploy/mail-env.test.mjs
      - name: Check contract lock and version declarations
        run: uv run --project MAIN --locked python MAIN/scripts/relock_contracts.py --check
      - name: Check execution modes, contract lock and e-mail rules (no database)
        working-directory: B2
        env:
          DATABASE_URL: ""
          B2_TEST_DATABASE_URL: ""
          # The platform SDK locates MAIN/contracts through B4's deployment-root variable;
          # in CI the module is imported from site-packages, so the source-tree fallback
          # cannot work. The contract tests need the real checkout root.
          B4_MODULE_ROOT: ${{ github.workspace }}
        run: |
          # CHG-0031/0032: these suites are intentionally database-free so they can run in the
          # verify job before any service exists. The Linux nsjail acceptance suite is NOT
          # here: it needs a privileged Linux sandbox and is run separately.
          ../MAIN/.venv/bin/python -m pytest -q \
            tests/test_runner_batch.py \
            tests/test_email_verification_rules.py \
            tests/test_contract_conformance.py \
            tests/test_frozen_interfaces.py \
            tests/test_intake_directory_matcher.py
          ../MAIN/.venv/bin/python -m pytest -q tests/test_email_intake.py::test_mail_puller_uses_b2_scoped_database_configuration

  verify-frontend:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: B1/pnpm-lock.yaml
      - name: Check the assignment workspace and teacher views
        working-directory: B1
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm api:check
          pnpm typecheck
          pnpm test

  verify-database:
    # Real PostgreSQL + NATS on an isolated Linux runner (CHG-0032 acceptance). The API
    # process itself is not started here: these suites drive the real modules against the
    # real schema, and the mail path uses the repository's real TCP IMAP fixture.
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: autograder
          POSTGRES_USER: autograder_platform
          POSTGRES_PASSWORD: ci-platform-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autograder_platform -d autograder"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.1
          enable-cache: true
          cache-dependency-glob: MAIN/uv.lock
      - name: Install the backend workspace
        run: uv sync --project MAIN --all-groups --extra modules --locked
      - name: Install the PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create the least-privilege roles and schemas
        env:
          PGHOST: 127.0.0.1
          PGUSER: autograder_platform
          PGPASSWORD: ci-platform-password
          PGDATABASE: autograder
          AUTOGRADER_B2_DB_PASSWORD: ci-b2
          AUTOGRADER_B3_APP_DB_PASSWORD: ci-b3app
          AUTOGRADER_B3_INTERNAL_DB_PASSWORD: ci-b3internal
          AUTOGRADER_B4_DB_PASSWORD: ci-b4
        run: |
          psql --username "$PGUSER" --dbname "$PGDATABASE" --set ON_ERROR_STOP=1 \
            -v b2_password="$AUTOGRADER_B2_DB_PASSWORD" \
            -v b3_app_password="$AUTOGRADER_B3_APP_DB_PASSWORD" \
            -v b3_internal_password="$AUTOGRADER_B3_INTERNAL_DB_PASSWORD" \
            -v b4_password="$AUTOGRADER_B4_DB_PASSWORD" \
            -f MAIN/infra/postgres/init.sql
      - name: Migrate and provision B4
        working-directory: B4
        env:
          DATABASE_URL: postgresql+psycopg://autograder_platform:ci-platform-password@127.0.0.1:5432/autograder
          B4_ADMIN_DATABASE_URL: postgresql+psycopg://autograder_platform:ci-platform-password@127.0.0.1:5432/autograder
          B4_DB_PASSWORD: ci-b4
        run: |
          ../MAIN/.venv/bin/python -m alembic upgrade head
          ../MAIN/.venv/bin/python -m autograder_b4.ops.provision
      - name: B2 submission, grades, email and migrations (real PostgreSQL)
        working-directory: B2
        env:
          B2_TEST_DATABASE_URL: postgresql+psycopg://autograder_platform:ci-platform-password@127.0.0.1:5432/autograder
          B4_MODULE_ROOT: ${{ github.workspace }}
        run: |
          ../MAIN/.venv/bin/python -m pytest -q \
            tests/test_migrations.py \
            tests/test_storage_cas.py \
            tests/test_submission_loader.py \
            tests/test_submission_query.py \
            tests/test_grades_query_export.py \
            tests/test_intake_api.py \
            tests/test_b2_routes.py \
            tests/test_worker.py \
            tests/test_email_intake_acceptance.py \
            tests/test_email_verification_flow.py
      - name: B3 assignment, version and authorization (real PostgreSQL)
        working-directory: B3
        env:
          B3_TEST_OWNER_URL: postgresql+psycopg://autograder_platform:ci-platform-password@127.0.0.1:5432/autograder
          B3_TEST_APP_URL: postgresql+psycopg://autograder_b3_app:ci-b3app@127.0.0.1:5432/autograder
          B3_TEST_INTERNAL_URL: postgresql+psycopg://autograder_b3_internal:ci-b3internal@127.0.0.1:5432/autograder
        run: |
          # The suite uses a DESTRUCTIVE session-scoped schema and was never part of CI
          # before this change; several long-dormant tests in the broad files are already
          # red at the base revision (e.g. they call the payload builder with a keyword it
          # never accepted) and are unrelated to the assignment rework. Each invocation
          # gets a fresh migrated schema, so the new assignment suites cannot pollute the
          # count-based assertions of another file.
          ../MAIN/.venv/bin/python -m pytest -q \
            tests/test_assignments_api.py \
            tests/test_b4_client.py
          ../MAIN/.venv/bin/python -m pytest -q \
            tests/test_migrations.py \
            tests/test_auth.py
          ../MAIN/.venv/bin/python -m pytest -q \
            tests/test_questions_api.py::test_assignment_create_and_list \
            tests/test_questions_api.py::test_assignment_with_a_draft_version_is_conflict \
            tests/test_questions_api.py::test_assignment_detail_reads_one_assignment_by_id \
            tests/test_questions_api.py::test_assignment_detail_outside_the_course_scope_is_forbidden \
            tests/test_questions_api.py::test_assignment_detail_for_an_unknown_id_is_not_found \
            tests/test_versions.py::test_assignment_accepts_only_published_versions \
            tests/test_versions.py::test_assignment_referencing_another_course_is_not_found
      - name: Prepare B4 signing key for the test suite
        env:
          JWT_PRIVATE_KEY_FILE: ${{ runner.temp }}/jwt-ed25519.pem
        run: MAIN/.venv/bin/python -m autograder_b4.ops.generate_key
      - name: B4 internal target validation and identity (real PostgreSQL)
        working-directory: B4
        env:
          B4_TEST_DATABASE_URL: postgresql+psycopg://autograder_b4:ci-b4@127.0.0.1:5432/autograder
          B4_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://autograder_platform:ci-platform-password@127.0.0.1:5432/autograder
          B4_TEST_NATS_URL: nats://127.0.0.1:4222
          JWT_PRIVATE_KEY_FILE: ${{ runner.temp }}/jwt-ed25519.pem
        run: |
          ../MAIN/.venv/bin/python -m pytest -q \
            tests/test_internal_course_targets.py \
            tests/test_internal_identities.py \
            tests/test_current_user.py \
            tests/test_authorization.py \
            tests/test_auth.py \
            tests/test_users_courses.py

      # ------------------------------------------------------------------ end-to-end
      # The module suites above prove each boundary against real PostgreSQL. This block
      # starts the composed host (B2+B3+B4 in one process) and drives the whole teacher ->
      # student web/mail -> teacher flow over real HTTP, with synthetic accounts seeded into
      # the real b4 schema and a real TCP IMAP fixture for the mail leg.
      - name: Acceptance — reset schemas for the composed host
        env:
          PGHOST: 127.0.0.1
          PGUSER: autograder_platform
          PGPASSWORD: ci-platform-password
          PGDATABASE: autograder
          AUTOGRADER_B2_DB_PASSWORD: ci-b2
          AUTOGRADER_B3_APP_DB_PASSWORD: ci-b3app
          AUTOGRADER_B3_INTERNAL_DB_PASSWORD: ci-b3internal
          AUTOGRADER_B4_DB_PASSWORD: ci-b4
        run: |
          psql --username "$PGUSER" --dbname "$PGDATABASE" --set ON_ERROR_STOP=1 \
            -c "DROP SCHEMA IF EXISTS b2 CASCADE" \
            -c "DROP SCHEMA IF EXISTS b3 CASCADE" \
            -c "DROP SCHEMA IF EXISTS b4 CASCADE" \
            -c "CREATE SCHEMA b2" -c "CREATE SCHEMA b3" -c "CREATE SCHEMA b4"
          psql --username "$PGUSER" --dbname "$PGDATABASE" --set ON_ERROR_STOP=1 \
            -v b2_password="$AUTOGRADER_B2_DB_PASSWORD" \
            -v b3_app_password="$AUTOGRADER_B3_APP_DB_PASSWORD" \
            -v b3_internal_password="$AUTOGRADER_B3_INTERNAL_DB_PASSWORD" \
            -v b4_password="$AUTOGRADER_B4_DB_PASSWORD" \
            -f MAIN/infra/postgres/init.sql
      - name: Acceptance — migrate the composed host schemas
        env:
          DATABASE_URL: postgresql+psycopg://autograder_platform:ci-platform-password@127.0.0.1:5432/autograder
        run: |
          for module in B2 B3 B4; do
            ( cd "$module" && DATABASE_URL="$DATABASE_URL" ../MAIN/.venv/bin/python -m alembic upgrade head )
          done
          ( cd B4 && DATABASE_URL="$DATABASE_URL" ../MAIN/.venv/bin/python -m autograder_b4.ops.provision )
      - name: Acceptance — signing key and JWKS
        env:
          JWT_PRIVATE_KEY_FILE: ${{ runner.temp }}/jwt-ed25519.pem
          B2_JWKS_PATH: ${{ runner.temp }}/jwks.json
        run: |
          test -s "$JWT_PRIVATE_KEY_FILE" || MAIN/.venv/bin/python -m autograder_b4.ops.generate_key
          MAIN/.venv/bin/python MAIN/host/write_jwks.py "$JWT_PRIVATE_KEY_FILE" "$B2_JWKS_PATH"
      - name: Acceptance — composed host end-to-end (teacher / web / mail / answers)
        env:
          PLATFORM_DATABASE_URL: postgresql+psycopg://autograder_platform:ci-platform-password@127.0.0.1:5432/autograder
          ACCEPTANCE_SERVICE_TOKEN: ci-service-token
          ACCEPTANCE_BASE_URL: http://127.0.0.1:18000
          JWT_PRIVATE_KEY_FILE: ${{ runner.temp }}/jwt-ed25519.pem
          B2_JWKS_PATH: ${{ runner.temp }}/jwks.json
          B4_MODULE_ROOT: ${{ github.workspace }}
          B4_DATABASE_URL: postgresql+psycopg://autograder_b4:ci-b4@127.0.0.1:5432/autograder
          B4_NATS_URL: nats://127.0.0.1:4222
          B4_ENV: development
          B4_JWT_ISSUER: autograder
          B4_JWT_AUDIENCE: autograder-api
          B4_JWKS_URL: http://127.0.0.1:18000/api/v1/auth/jwks
          B4_SERVICE_TOKEN: ci-service-token
          B2_DATABASE_URL: postgresql+psycopg://autograder_b2:ci-b2@127.0.0.1:5432/autograder
          B2_NATS_URL: nats://127.0.0.1:4222
          B2_ENV: development
          B2_ARTIFACT_ROOT: ${{ runner.temp }}/artifacts
          B2_WORKSPACE_ROOT: ${{ runner.temp }}/workspace
          B2_B3_BASE_URL: http://127.0.0.1:18000
          B2_B3_AUTHORIZATION: Bearer ci-service-token
          B2_IDENTITY_URL: http://127.0.0.1:18000
          B2_IDENTITY_AUTHORIZATION: Bearer ci-service-token
          # The challenge endpoints live in the verification service, which is assembled only
          # when the mail intake is configured. These values need not point at a reachable
          # mailbox (the host never pulls); the acceptance script starts the real IMAP fixture
          # and runs the puller CLI against it.
          B2_IMAP_HOST: 127.0.0.1
          B2_IMAP_PORT: "143"
          B2_IMAP_USERNAME: acceptance-inbox
          B2_IMAP_PASSWORD: acceptance-imap-pass
          B2_IMAP_MAILBOX: INBOX
          B2_IMAP_USE_SSL: "false"
          B3_DATABASE_URL: postgresql+psycopg://autograder_b3_app:ci-b3app@127.0.0.1:5432/autograder
          B3_DATABASE_PROTECTED_URL: postgresql+psycopg://autograder_b3_internal:ci-b3internal@127.0.0.1:5432/autograder
          B3_NATS_URL: nats://127.0.0.1:4222
          B3_JWT_ISSUER: autograder
          B3_JWT_AUDIENCE: autograder-api
          B3_SERVICE_TOKEN: ci-service-token
          B3_B4_BASE_URL: http://127.0.0.1:18000
          B3_B4_SERVICE_TOKEN: ci-service-token
          NATS_URL: nats://127.0.0.1:4222
        run: |
          mkdir -p "$B2_ARTIFACT_ROOT" "$B2_WORKSPACE_ROOT"
          MAIN/.venv/bin/python -m uvicorn autograder_host.main:app \
            --host 127.0.0.1 --port 18000 > "$RUNNER_TEMP/host.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/host.pid"
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:18000/health/live >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          MAIN/.venv/bin/python MAIN/scripts/acceptance_assignment_workflow.py
      - name: Acceptance — host log on failure
        if: failure()
        run: |
          test -f "$RUNNER_TEMP/host.log" && tail -n 300 "$RUNNER_TEMP/host.log" || true
          test -f "$RUNNER_TEMP/host.pid" && cat "$RUNNER_TEMP/host.pid" || true

  deploy:
    needs: [verify, verify-frontend, verify-database]
    if: ${{ always() && github.ref == 'refs/heads/main' && ((needs.verify.result == 'success' && needs.verify-frontend.result == 'success' && needs.verify-database.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.operation != 'deploy')) }}
    concurrency:
      group: autograder-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Fetch deployment secrets from Doppler
        uses: DopplerHQ/secrets-fetch-action@cf794d40f721280fa2c068fa4f9e8afbc966e41d
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: autograder
          doppler-config: prd
          inject-env-vars: false

      - name: Check the mail channel (no secret is printed)
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'check-mail'
        env:
          IMAP_HOST: ${{ steps.doppler.outputs.IMAP_HOST }}
          IMAP_PORT: ${{ steps.doppler.outputs.IMAP_PORT }}
          IMAP_USER: ${{ steps.doppler.outputs.IMAP_USER }}
          IMAP_PASS: ${{ steps.doppler.outputs.IMAP_PASS }}
          B2_IMAP_MAILBOX: ${{ steps.doppler.outputs.B2_IMAP_MAILBOX }}
        run: |
          set -euo pipefail
          # 端点可达性不需要任何凭据，先跑它：把"网络不通"与"授权码不对"分开。
          python3 MAIN/scripts/probe_mail_endpoints.py \
            --imap-host "${IMAP_HOST:-imap.qq.com}" \
            --imap-port "${IMAP_PORT:-993}"
          if [[ -z "${IMAP_USER:-}" || -z "${IMAP_PASS:-}" ]]; then
            echo "::warning::IMAP_USER / IMAP_PASS are not present in Doppler; login not attempted."
            exit 0
          fi
          # 登录探测只打印状态：欢迎语、ID 是否被接受、最近邮件数与主题。
          # 口令从环境读取，脚本从不回显它。
          B2_IMAP_PASSWORD="$IMAP_PASS" python3 MAIN/scripts/probe_imap_mailbox.py \
            --host "${IMAP_HOST:-imap.qq.com}" \
            --port "${IMAP_PORT:-993}" \
            --username "$IMAP_USER" \
            --mailbox "${B2_IMAP_MAILBOX:-INBOX}" \
            --limit 3

      - name: Validate deployment credentials and SSH host fingerprint
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_HOSTKEY: ${{ steps.doppler.outputs.DEPLOY_SSH_HOSTKEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PASSWORD DEPLOY_SSH_PORT DEPLOY_SSH_HOSTKEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Doppler secret $name is missing."
              exit 1
            fi
          done
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || {
            echo "::error::DEPLOY_SSH_PORT must be a valid TCP port."
            exit 1
          }
          port=$((10#$DEPLOY_SSH_PORT))
          (( port >= 1 && port <= 65535 )) || {
            echo "::error::DEPLOY_SSH_PORT must be a valid TCP port."
            exit 1
          }
          [[ "$DEPLOY_SSH_HOSTKEY" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || {
            echo "::error::DEPLOY_SSH_HOSTKEY must be a verified SHA256 fingerprint."
            exit 1
          }

      - name: Install OpenSSH password transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Pin the stored ED25519 host key
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_HOSTKEY: ${{ steps.doppler.outputs.DEPLOY_SSH_HOSTKEY }}
        run: |
          set -euo pipefail
          scan_file="$RUNNER_TEMP/autograder-hostkey-scan"
          known_hosts_file="$RUNNER_TEMP/autograder-known-hosts"
          : > "$known_hosts_file"

          # ssh-keyscan 还会输出 `# host:port SSH-2.0-...` 这类注释行；它们不是公钥，
          # 一旦被当成公钥喂给 ssh-keygen，整个步骤会因为 `set -e` 在打印真实原因前退出。
          # ssh-keyscan 在部分失败时也返回非零，所以这里只要求"仍拿到了内容"；
          # 真正是否有可用密钥由下面的 key_lines 判断。
          ssh-keyscan -T 10 -p "$DEPLOY_SSH_PORT" -t ed25519 "$DEPLOY_SSH_HOST" \
            > "$scan_file" 2>/dev/null || true
          if [[ ! -s "$scan_file" ]]; then
            echo "::error::ssh-keyscan could not reach ${DEPLOY_SSH_HOST}:${DEPLOY_SSH_PORT}."
            exit 1
          fi

          key_lines=0
          live_fingerprints=""
          while read -r scanned_host key_type key_data _; do
            case "${key_type:-}" in
              ssh-ed25519|sk-ssh-ed25519@openssh.com) ;;
              *) continue ;;
            esac
            [[ -n "${key_data:-}" ]] || continue
            key_lines=$((key_lines + 1))
            candidate="$RUNNER_TEMP/autograder-hostkey-candidate"
            printf '%s %s\n' "$key_type" "$key_data" > "$candidate"
            # 单行解析失败只丢这一行，不终止步骤。
            fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 2>/dev/null \
              | awk 'NR == 1 { print $2 }' || true)"
            rm -f "$candidate"
            [[ -n "$fingerprint" ]] || continue
            live_fingerprints="${live_fingerprints:+$live_fingerprints, }$fingerprint"
            if [[ "$fingerprint" == "$DEPLOY_SSH_HOSTKEY" ]]; then
              printf '%s %s %s\n' "$scanned_host" "$key_type" "$key_data" \
                >> "$known_hosts_file"
            fi
          done < "$scan_file"

          if [[ "$key_lines" -eq 0 ]]; then
            echo "::error::ssh-keyscan returned no ED25519 host key for ${DEPLOY_SSH_HOST}:${DEPLOY_SSH_PORT}."
            echo "The host may be unreachable from the runner, or may not offer ED25519."
            exit 1
          fi
          if [[ ! -s "$known_hosts_file" ]]; then
            echo "::error::The live ED25519 host key does not match the pinned fingerprint."
            echo "Pinned: $DEPLOY_SSH_HOSTKEY"
            echo "Live ED25519 fingerprints: $live_fingerprints"
            exit 1
          fi
          chmod 0600 "$known_hosts_file"
          printf 'AUTOGRADER_SSH_KNOWN_HOSTS=%s\n' "$known_hosts_file" >> "$GITHUB_ENV"

      - name: Inspect one-time server environment state
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap-host'
        id: host_config
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          state="$(bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          count=0
          for path in /etc/autograder/runtime.env /etc/autograder/setup.env; do
            if [[ -e "$path" || -L "$path" ]]; then
              [[ -f "$path" && ! -L "$path" && -s "$path" && \
                "$(stat -c %U:%a "$path")" == root:600 ]] || exit 1
              count=$((count + 1))
            fi
          done
          case "$count" in
            0) printf 'missing\n' ;;
            2) printf 'present\n' ;;
            *) exit 1 ;;
          esac
          REMOTE
          )"
          [[ "$state" == missing || "$state" == present ]] || {
            echo "::error::Existing host environment files are incomplete or invalid."
            exit 1
          }
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

      - name: Render one-time host environment files
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap-host' && steps.host_config.outputs.state == 'missing'
        env:
          POSTGRES_PASSWORD: ${{ steps.doppler.outputs.POSTGRES_PASSWORD }}
          B2_DB_PASSWORD: ${{ steps.doppler.outputs.B2_DB_PASSWORD }}
          B3_APP_DB_PASSWORD: ${{ steps.doppler.outputs.B3_APP_DB_PASSWORD }}
          B3_INTERNAL_DB_PASSWORD: ${{ steps.doppler.outputs.B3_INTERNAL_DB_PASSWORD }}
          B4_DB_PASSWORD: ${{ steps.doppler.outputs.B4_DB_PASSWORD }}
          B2_B3_SERVICE_TOKEN: ${{ steps.doppler.outputs.B2_B3_SERVICE_TOKEN }}
        run: node MAIN/deploy/write-runtime-env.mjs runtime.env setup.env "$GITHUB_SHA"

      - name: Install one-time host environment files
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap-host' && steps.host_config.outputs.state == 'missing'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          config_dir="/tmp/autograder-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            install -d -o root -g root -m 0700 "$config_dir"
          bash .github/scripts/deploy-ssh.sh scp runtime.env setup.env \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$config_dir/"
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^[0-9]+$ && "$2" =~ ^[1-9][0-9]*$ ]]
          config_dir="/tmp/autograder-config-$1-$2"
          [[ -d "$config_dir" && ! -L "$config_dir" ]]
          for name in runtime.env setup.env; do
            [[ -f "$config_dir/$name" && ! -L "$config_dir/$name" && -s "$config_dir/$name" ]]
          done
          [[ ! -e /etc/autograder/runtime.env && ! -L /etc/autograder/runtime.env && \
            ! -e /etc/autograder/setup.env && ! -L /etc/autograder/setup.env ]]
          install -d -o root -g cloudflared -m 0750 /etc/autograder
          install -o root -g root -m 0600 "$config_dir/runtime.env" /etc/autograder/runtime.env
          install -o root -g root -m 0600 "$config_dir/setup.env" /etc/autograder/setup.env
          rm -f -- "$config_dir/runtime.env" "$config_dir/setup.env"
          rmdir -- "$config_dir"
          REMOTE

      - name: Remove local one-time environment files
        if: always()
        run: rm -f runtime.env setup.env

      - name: Remove one-time server environment staging files
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap-host' && steps.host_config.outputs.state == 'missing'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^[0-9]+$ && "$2" =~ ^[1-9][0-9]*$ ]]
          config_dir="/tmp/autograder-config-$1-$2"
          if [[ -e "$config_dir" || -L "$config_dir" ]]; then
            [[ -d "$config_dir" && ! -L "$config_dir" ]]
            for name in runtime.env setup.env; do
              path="$config_dir/$name"
              if [[ -e "$path" || -L "$path" ]]; then
                [[ -f "$path" && ! -L "$path" ]]
                rm -f -- "$path"
              fi
            done
            rmdir -- "$config_dir"
          fi
          REMOTE

      - name: Render mail channel variables (SMTP + IMAP intake)
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-mail-channel'
        env:
          SMTP_HOST: ${{ steps.doppler.outputs.SMTP_HOST }}
          SMTP_PORT: ${{ steps.doppler.outputs.SMTP_PORT }}
          SMTP_USER: ${{ steps.doppler.outputs.SMTP_USER }}
          SMTP_PASS: ${{ steps.doppler.outputs.SMTP_PASS }}
          SMTP_FROM: ${{ steps.doppler.outputs.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ steps.doppler.outputs.SMTP_FROM_NAME }}
          SMTP_TLS_MODE: ${{ steps.doppler.outputs.SMTP_TLS_MODE }}
          SMTP_TIMEOUT_SECONDS: ${{ steps.doppler.outputs.SMTP_TIMEOUT_SECONDS }}
          # 收信通道（B2 IMAP）：Doppler 里没配就整体跳过；配了就必须成套，
          # 半配置由 write-mail-env.mjs 直接拒绝。
          # Doppler 里的实际命名（与 SMTP_* 同风格）；翻译成 B2_IMAP_* 由 mail-env.mjs 负责。
          IMAP_HOST: ${{ steps.doppler.outputs.IMAP_HOST }}
          IMAP_PORT: ${{ steps.doppler.outputs.IMAP_PORT }}
          IMAP_USER: ${{ steps.doppler.outputs.IMAP_USER }}
          IMAP_PASS: ${{ steps.doppler.outputs.IMAP_PASS }}
          IMAP_TLS_MODE: ${{ steps.doppler.outputs.IMAP_TLS_MODE }}
          # 收信身份查询：CHG-0032 起收件路由只来自一次性核验码 + B4 身份目录，
          # 不再有部署期固定作业目标/匹配规则表。服务令牌复用 B2→B3 的那一枚。
          B2_IDENTITY_URL: ${{ steps.doppler.outputs.B2_IDENTITY_URL }}
          B2_B3_SERVICE_TOKEN: ${{ steps.doppler.outputs.B2_B3_SERVICE_TOKEN }}
        run: node MAIN/deploy/write-mail-env.mjs "$RUNNER_TEMP/mail.env"

      - name: Install mail channel variables on the host
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-mail-channel'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          staging="/tmp/autograder-mail-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            install -d -o root -g root -m 0700 "$staging"
          bash .github/scripts/deploy-ssh.sh scp "$RUNNER_TEMP/mail.env" MAIN/deploy/merge-env-keys.py \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$staging/"
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^[0-9]+$ && "$2" =~ ^[1-9][0-9]*$ ]]
          staging="/tmp/autograder-mail-$1-$2"
          [[ -d "$staging" && ! -L "$staging" ]]
          for name in mail.env merge-env-keys.py; do
            [[ -f "$staging/$name" && ! -L "$staging/$name" && -s "$staging/$name" ]]
          done
          # 上一轮同步写进去、如今不该存在的键要先删：合并工具只增不删，而收信入口在缺少
          # 上一轮同步写进去、如今不该存在的键要先删：合并工具只增不删，而收信入口在缺少
          # 匹配规则时是 unavailable，会把整机 readiness 拉红。渲染器现在不会再写它们，
          # 这里负责把历史遗留清掉。
          if grep -q '^B2_IMAP_' /etc/autograder/runtime.env; then
            grep -v '^B2_IMAP_' /etc/autograder/runtime.env > "$staging/runtime.clean.env"
            install -m 0600 "$staging/runtime.clean.env" /etc/autograder/runtime.env
            rm -f -- "$staging/runtime.clean.env"
            printf 'dropped stale B2_IMAP_* keys\n'
          fi
          python3 "$staging/merge-env-keys.py" \
            --target /etc/autograder/runtime.env --fragment "$staging/mail.env"
          rm -f -- "$staging/mail.env" "$staging/merge-env-keys.py"
          rmdir -- "$staging"
          if systemctl cat autograder-worker.service >/dev/null 2>&1; then
            systemctl stop autograder-worker.service
          fi
          systemctl restart autograder.service
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:18000/health/ready 2>/dev/null \
              | grep -q '"ready": *true'; then
              systemctl start autograder-worker.service
              printf 'service ready after %s attempt(s)\n' "$attempt"
              exit 0
            fi
            sleep 2
          done
          printf 'service did not become ready; recent unit output:\n' >&2
          journalctl -u autograder.service -n 40 --no-pager >&2
          exit 1
          REMOTE

      - name: Remove the local mail channel fragment
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-mail-channel'
        run: rm -f "$RUNNER_TEMP/mail.env"

      # The model provider (LLM_BASE_URL / LLM_MODEL_NAME / LLM_APIKEY). The environment file
      # is rendered once by `bootstrap-host` and never rewritten by an ordinary release, so a
      # host that already exists needs exactly this merge to pick the block up.
      - name: Render model provider variables
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-llm-config'
        env:
          LLM_BASE_URL: ${{ steps.doppler.outputs.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ steps.doppler.outputs.LLM_MODEL_NAME }}
          LLM_APIKEY: ${{ steps.doppler.outputs.LLM_APIKEY }}
        run: node MAIN/deploy/write-llm-env.mjs "$RUNNER_TEMP/llm.env"

      - name: Install model provider variables on the host
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-llm-config'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          staging="/tmp/autograder-llm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            install -d -o root -g root -m 0700 "$staging"
          bash .github/scripts/deploy-ssh.sh scp "$RUNNER_TEMP/llm.env" MAIN/deploy/merge-env-keys.py \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$staging/"
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^[0-9]+$ && "$2" =~ ^[1-9][0-9]*$ ]]
          staging="/tmp/autograder-llm-$1-$2"
          [[ -d "$staging" && ! -L "$staging" ]]
          for name in llm.env merge-env-keys.py; do
            [[ -f "$staging/$name" && ! -L "$staging/$name" && -s "$staging/$name" ]]
          done
          python3 "$staging/merge-env-keys.py" \
            --target /etc/autograder/runtime.env --fragment "$staging/llm.env"
          rm -f -- "$staging/llm.env" "$staging/merge-env-keys.py"
          rmdir -- "$staging"
          systemctl restart autograder.service
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:18000/health/ready 2>/dev/null \
              | grep -q '"ready": *true'; then
              printf 'service ready after %s attempt(s)\n' "$attempt"
              exit 0
            fi
            sleep 2
          done
          printf 'service did not become ready; recent unit output:\n' >&2
          journalctl -u autograder.service -n 40 --no-pager >&2
          exit 1
          REMOTE

      - name: Remove the local model provider fragment
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-llm-config'
        run: rm -f "$RUNNER_TEMP/llm.env"

      # Three layers can be wrong after a config change, and the teacher-facing panel cannot
      # tell them apart. This prints one line per layer, without a credential or a model answer:
      #   service_env=...        which LLM_* names the *running* service process actually has
      #   provider_direct=...    credential + endpoint accepted with no proxy in the way
      #   provider_proxy=...     the same call through the host proxy the unit configures
      - name: Self-check the model provider from the host
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-llm-config'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          staging="/tmp/autograder-llm-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            install -d -o root -g root -m 0700 "$staging"
          bash .github/scripts/deploy-ssh.sh scp MAIN/deploy/verify_provider.py \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$staging/"
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^[0-9]+$ && "$2" =~ ^[1-9][0-9]*$ ]]
          staging="/tmp/autograder-llm-check-$1-$2"
          [[ -d "$staging" && ! -L "$staging" ]]
          [[ -f "$staging/verify_provider.py" && ! -L "$staging/verify_provider.py" ]]
          trap 'rm -f -- "$staging/verify_provider.py"; rmdir -- "$staging" 2>/dev/null || true' EXIT

          pid="$(systemctl show autograder.service -p MainPID --value)"
          if [[ "$pid" =~ ^[1-9][0-9]*$ && -r "/proc/$pid/environ" ]]; then
            names="$(tr '\0' '\n' < "/proc/$pid/environ" \
              | grep -E '^LLM_[A-Z_]+=' | cut -d= -f1 | sort | paste -sd, -)"
            printf 'service_env=%s\n' "${names:-none}"
          else
            printf '%s\n' 'service_env=unreadable'
          fi

          set -a
          source /etc/autograder/runtime.env
          set +a
          cd /opt/autograder/current/MAIN
          python="$PWD/.venv/bin/python"
          if [[ ! -x "$python" ]]; then
            printf '%s\n' 'provider_direct=failed category=interpreter_missing'
            exit 0
          fi
          env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY \
            "$python" "$staging/verify_provider.py" direct \
            || printf '%s\n' 'provider_direct=failed category=script_error'
          HTTP_PROXY=http://127.0.0.1:7893 HTTPS_PROXY=http://127.0.0.1:7893 \
          http_proxy=http://127.0.0.1:7893 https_proxy=http://127.0.0.1:7893 \
          NO_PROXY=localhost,127.0.0.1,::1 no_proxy=localhost,127.0.0.1,::1 \
            "$python" "$staging/verify_provider.py" proxy \
            || printf '%s\n' 'provider_proxy=failed category=script_error'
          REMOTE

      - name: Install current deployment scripts
        if: github.event_name == 'push' || inputs.operation == 'deploy' || inputs.operation == 'bootstrap-host'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bootstrap_dir="/tmp/autograder-control-plane-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            install -d -o root -g root -m 0700 "$bootstrap_dir"
          bash .github/scripts/deploy-ssh.sh scp \
            MAIN/deploy/autograder-deployctl MAIN/scripts/production-preflight.sh \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$bootstrap_dir/"
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^[0-9]+$ && "$2" =~ ^[1-9][0-9]*$ ]]
          bootstrap_dir="/tmp/autograder-control-plane-$1-$2"
          [[ -d "$bootstrap_dir" && ! -L "$bootstrap_dir" ]]
          cleanup() {
            status=$?
            trap - EXIT
            for name in autograder-deployctl production-preflight.sh; do
              path="$bootstrap_dir/$name"
              if [[ -e "$path" || -L "$path" ]]; then
                [[ -f "$path" && ! -L "$path" ]]
                rm -f -- "$path"
              fi
            done
            rmdir -- "$bootstrap_dir"
            exit "$status"
          }
          trap cleanup EXIT
          install -d -o root -g root -m 0755 /usr/local/lib/autograder
          install -o root -g root -m 0750 "$bootstrap_dir/autograder-deployctl" \
            /usr/local/sbin/autograder-deployctl
          install -o root -g root -m 0750 "$bootstrap_dir/production-preflight.sh" \
            /usr/local/lib/autograder/production-preflight.sh
          chown -R autograder:autograder /opt/autograder/python
          chown root:cloudflared /etc/autograder /etc/autograder/cloudflared.token
          chmod 0750 /etc/autograder
          chmod 0640 /etc/autograder/cloudflared.token
          REMOTE

      - name: Run read-only server preflight
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'preflight'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            /usr/local/sbin/autograder-deployctl preflight

      - name: Capture read-only API and database migration state
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'diagnose'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          printf '%s\n' 'Service state:'
          for unit in autograder.service cloudflared.service; do
            printf 'unit=%s ' "$unit"
            systemctl show "$unit" --property=LoadState,ActiveState,SubState,Result,ExecMainStatus | tr '\n' ' '
            printf '\n'
          done
          if [[ -L /opt/autograder/current ]]; then
            printf 'current_release=%s\n' "$(readlink -f /opt/autograder/current 2>/dev/null || printf broken)"
          else
            printf '%s\n' 'current_release=none'
          fi
          printf 'api_listener='; ss -H -ltn 'sport = :18000' | head -n 1 || true
          if readiness="$(curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18000/health/ready 2>/dev/null)"; then
            printf '%s' "$readiness" | python3 -c 'import json,sys; p=json.load(sys.stdin); print("local_ready={}; modules={}".format(p.get("ready"), {str(m.get("name","")): m.get("healthy") for m in p.get("modules", [])}))'
          else
            printf '%s\n' 'local_readiness=unreachable'
          fi
          printf '%s\n' 'Recent service error counts (last 30 min):'
          for unit in autograder.service cloudflared.service; do
            count="$(journalctl -u "$unit" --since '-30 min' --no-pager -o json \
              --grep 'Traceback|Error:|Exception:|Permission denied|Address already in use|ERROR:|failed|critical' \
              | python3 -c 'import json,sys; print(sum(1 for line in sys.stdin if json.loads(line)))')"
            printf '%s: %s\n' "$unit" "$count"
          done
          postgres_container="$(docker ps --filter label=com.docker.compose.project=autograder --filter label=com.docker.compose.service=postgres --format '{{.Names}}' | head -n 1)"
          if [[ -z "$postgres_container" ]]; then
            printf '%s\n' 'migration_revisions=postgres_container_missing'
          else
            printf '%s\n' 'Migration revisions:'
            docker exec "$postgres_container" sh -c 'for schema in b2 b3 b4; do case "$schema" in b2) table=alembic_version_b2 ;; b3) table=alembic_version_b3 ;; b4) table=alembic_version_b4 ;; esac; version=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT version_num FROM ${schema}.${table}" 2>/dev/null || true); printf "%s=%s\n" "$schema" "${version:-missing}"; done'
          fi
          REMOTE

      - name: Capture reference-verification diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'diagnose'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          echo 'Sandbox identities:'
          id
          getent passwd nobody
          getent passwd autograder
          echo 'Sandbox binaries:'
          for binary in nsjail python3 bash; do
            printf '%s=' "$binary"
            if ! command -v "$binary"; then echo missing; fi
          done
          echo 'Workspace roots (mode/owner/path):'
          for candidate in /var/lib/autograder /var/lib/autograder/workspace /var/lib/autograder/b2 /var/lib/autograder/b2/workspaces /opt/autograder/workspaces /srv/autograder; do
            if [ -e "$candidate" ]; then stat -c '%A %U:%G %n' "$candidate"; fi
          done
          echo 'Service cgroup subtree (nsjail needs this free of tasks):'
          unit_cgroup=/sys/fs/cgroup/system.slice/autograder.service
          if [ -d "$unit_cgroup" ]; then
            printf 'subtree_control='; tr '\n' ' ' < "$unit_cgroup/cgroup.subtree_control"; printf '\n'
            printf 'cgroup_procs='; tr '\n' ' ' < "$unit_cgroup/cgroup.procs"; printf '\n'
            ls -1 "$unit_cgroup" | awk 'NR <= 20 { print }'
          else
            echo 'unit_cgroup=missing'
            exit 1
          fi
          echo 'Recent cgroup setup errors (last 20 min):'
          journalctl -u autograder.service --since '-20 min' --no-pager -o json \
            --grep 'Device or resource busy|Couldn.t setup parent cgroup|sandbox_unavailable' \
            | python3 -c 'import json,sys; print("matching_entries=" + str(sum(1 for line in sys.stdin if json.loads(line))))'
          REMOTE

      - name: Deploy this revision with server-side fetch and build
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            /usr/local/sbin/autograder-deployctl deploy "$GITHUB_SHA" "$DEPLOY_RELEASE_ID"

      - name: Report sandbox verification scope
        if: always() && (github.event_name == 'push' || inputs.operation == 'diagnose')
        run: |
          echo 'sandbox_execution=not_checked: SSH host canary does not run in the API service context.'
          echo 'Validate reference verification and resource limits in the service context separately.'
