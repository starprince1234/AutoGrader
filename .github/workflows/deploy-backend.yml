name: Deploy AutoGrader backend

on:
  push:
    branches:
      - main
    paths:
      - "B1/contracts.lock"
      - "B1/module.yaml"
      - "B2/alembic/**"
      - "B2/contracts.lock"
      - "B2/module.yaml"
      - "B2/pyproject.toml"
      - "B2/uv.lock"
      - "B2/src/**"
      - "B2/tests/**"
      - "B2/verify/linux-nsjail/**"
      - "B3/alembic/**"
      - "B3/contracts.lock"
      - "B3/module.yaml"
      - "B3/pyproject.toml"
      - "B3/src/**"
      - "B4/alembic/**"
      - "B4/compose.ci.yaml"
      - "B4/contracts.lock"
      - "B4/module.yaml"
      - "B4/pyproject.toml"
      - "B4/src/**"
      - "MAIN/contracts/**"
      - "MAIN/host/**"
      - "MAIN/infra/postgres/**"
      - "MAIN/compose.production.yaml"
      - "MAIN/pyproject.toml"
      - "MAIN/sdk/**"
      - "MAIN/scripts/production-prepare.sh"
      - "MAIN/scripts/test_evidence.py"
      - "MAIN/uv.lock"
      - ".github/scripts/deploy-ssh.sh"
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only production preflight or deployment after reusing a verified source run"
        required: true
        type: choice
        options:
          - preflight
          - deploy
        default: preflight
      verified_run_id:
        description: "Completed workflow run ID whose verify job passed"
        required: false
        type: string
      verified_commit_sha:
        description: "Full source commit SHA verified by that run"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: autograder-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.29.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: B1/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: B1
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        working-directory: B1
        run: pnpm verify

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.1
          enable-cache: true
          cache-dependency-glob: |
            MAIN/uv.lock
            B2/uv.lock
            B3/uv.lock
            B4/uv.lock
            B5/uv.lock

      - name: Install Python workspace
        run: uv sync --project MAIN --all-groups --extra modules --locked

      - name: Check B2 dependency lock
        run: uv lock --check --project B2

      - name: Lint Python modules
        run: |
          for project in MAIN B2 B3 B4 B5; do
            (cd "$project" && uv run --locked ruff check .)
          done

      - name: Build privileged nsjail test image
        run: docker build --file B2/verify/linux-nsjail/Dockerfile --tag autograder-b2-nsjail:ci .

      - name: Check sparse PAX parsing in the locked B2 image
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work/B2 \
            --tmpfs /work/B2/.pytest-tmp \
            --tmpfs /work/B2/.pytest_cache \
            --env DATABASE_URL=postgresql+psycopg://autograder_platform:change-me-local-only@127.0.0.1:55433/autograder \
            --env B2_TEST_DATABASE_URL=postgresql+psycopg://autograder_platform:change-me-local-only@127.0.0.1:55433/autograder \
            --env B2_TEST_NATS_URL=nats://127.0.0.1:54223 \
            --env PYTHONPATH=/work/B2/src:/work/MAIN/sdk/src \
            autograder-b2-nsjail:ci \
            /opt/autograder/B2/.venv/bin/python -m pytest -q \
            tests/test_email_intake.py::test_printable_pax_sparse_bomb_is_rejected_as_a_bomb

      - name: Prepare non-secret conformance test environment
        run: cp MAIN/.env.example MAIN/.env.integration

      - name: Start isolated module test services
        run: |
          docker compose --project-name autograder-b2-ci --file B2/compose.yaml up --detach --wait --wait-timeout 120 postgres nats
          docker compose --project-name autograder-b3-ci --file B3/compose.yaml up --detach --wait --wait-timeout 120 postgres
          docker compose --project-name autograder-b4-ci --file B4/compose.yaml --file B4/compose.ci.yaml up --detach --wait --wait-timeout 120 postgres nats

      - name: Prepare B4 test database
        working-directory: B4
        env:
          DATABASE_URL: postgresql+psycopg://autograder_platform:change-me-local-only@127.0.0.1:55435/autograder
          B4_ADMIN_DATABASE_URL: postgresql+psycopg://autograder_platform:change-me-local-only@127.0.0.1:55435/autograder
          B4_DB_PASSWORD: change-me
          B4_TEST_POSTGRES_CONTAINER: autograder-b4-ci-postgres-1
        run: |
          uv run --locked alembic upgrade head
          uv run --locked python -m autograder_b4.ops.provision

      - name: Prepare B2 integration database
        working-directory: B2
        env:
          DATABASE_URL: postgresql+psycopg://autograder_platform:change-me-local-only@127.0.0.1:55433/autograder
        run: uv run --locked alembic upgrade head

      - name: Prepare ephemeral signing key for composition tests
        run: |
          mkdir -p MAIN/.runtime
          uv run --project MAIN --locked python -m autograder_b4.ops.generate_key \
            --path "$GITHUB_WORKSPACE/MAIN/.runtime/ci-test-jwt.pem"
          sed -i "s|^JWT_PRIVATE_KEY_FILE=.*$|JWT_PRIVATE_KEY_FILE=$GITHUB_WORKSPACE/MAIN/.runtime/ci-test-jwt.pem|" \
            MAIN/.env.integration

      - name: Run every module test suite and record evidence
        env:
          JWT_PRIVATE_KEY_FILE: ${{ github.workspace }}/MAIN/.runtime/ci-test-jwt.pem
          AUTOGRADER_B2_NSJAIL_IMAGE: autograder-b2-nsjail:ci
          B4_TEST_POSTGRES_CONTAINER: autograder-b4-ci-postgres-1
        run: uv run --project MAIN python MAIN/scripts/test_evidence.py --all

      - name: Check project contracts and documentation
        run: uv run --project MAIN python -m autograder_host.checks

      - name: Capture isolated service logs on failure
        if: failure()
        run: |
          docker compose --project-name autograder-b2-ci --file B2/compose.yaml logs --no-color postgres nats
          docker compose --project-name autograder-b3-ci --file B3/compose.yaml logs --no-color postgres
          docker compose --project-name autograder-b4-ci --file B4/compose.yaml --file B4/compose.ci.yaml logs --no-color postgres nats

      - name: Stop isolated module test services
        if: always()
        run: |
          docker compose --project-name autograder-b2-ci --file B2/compose.yaml down --volumes --remove-orphans
          docker compose --project-name autograder-b3-ci --file B3/compose.yaml down --volumes --remove-orphans
          docker compose --project-name autograder-b4-ci --file B4/compose.yaml --file B4/compose.ci.yaml down --volumes --remove-orphans
          rm -f MAIN/.env.integration MAIN/.runtime/ci-test-jwt.pem

  deploy:
    needs: verify
    if: ${{ always() && (needs.verify.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate reused verification run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          CURRENT_SHA: ${{ github.sha }}
          OPERATION: ${{ inputs.operation }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
          VERIFIED_COMMIT_SHA: ${{ inputs.verified_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$OPERATION" == preflight || "$OPERATION" == deploy ]] || {
            echo "::error::Unsupported manual operation."
            exit 1
          }
          [[ "$VERIFIED_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::A completed verification run ID is required."
            exit 1
          }
          [[ "$VERIFIED_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::A full verified commit SHA is required."
            exit 1
          }
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "::error::Production operations must run from main."
            exit 1
          }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID")"
          [[ "$(jq -r '.head_branch' <<<"$run_json")" == main ]] || {
            echo "::error::The verification run must target main."
            exit 1
          }
          [[ "$(jq -r '.event' <<<"$run_json")" == push && \
            "$(jq -r '.path' <<<"$run_json")" == .github/workflows/deploy-backend.yml ]] || {
            echo "::error::The verification run must be a push run of this workflow."
            exit 1
          }
          [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$VERIFIED_COMMIT_SHA" ]] || {
            echo "::error::The supplied verification SHA does not match that run."
            exit 1
          }
          [[ "$(jq -r '.status' <<<"$run_json")" == completed ]] || {
            echo "::error::The supplied verification run has not completed."
            exit 1
          }
          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID/jobs?per_page=100")"
          verify_conclusion="$(jq -r '[.jobs[] | select(.name == "verify") | .conclusion][0] // empty' <<<"$jobs_json")"
          [[ "$verify_conclusion" == success ]] || {
            echo "::error::The referenced run has no successful verify job."
            exit 1
          }
          git merge-base --is-ancestor "$VERIFIED_COMMIT_SHA" "$CURRENT_SHA" || {
            echo "::error::The verified commit is not an ancestor of this deployment."
            exit 1
          }
          while IFS= read -r changed_path; do
            [[ -n "$changed_path" ]] || continue
            case "$changed_path" in
              .github/workflows/deploy-backend.yml|\
              .gitattributes|\
              MAIN/deploy/*|MAIN/scripts/production-preflight.sh|\
              MAIN/scripts/bootstrap-nsjail.sh|MAIN/scripts/bootstrap-cloudflared.sh|\
              MAIN/scripts/install-mihomo-autograder.sh|\
              MAIN/docs/runbooks/production-deployment.md|\
              MAIN/docs/phases/active/phase-01-integration-runtime.md)
                ;;
              *)
                echo "::error::Cannot reuse verification after non-operational change: $changed_path"
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$VERIFIED_COMMIT_SHA" "$CURRENT_SHA")
          for script in MAIN/scripts/production-preflight.sh MAIN/scripts/bootstrap-nsjail.sh MAIN/deploy/*.sh .github/scripts/deploy-ssh.sh; do
            bash -n "$script"
          done
          python3 - <<'PY'
          import ast
          from pathlib import Path

          ast.parse(Path("MAIN/deploy/patch-nsjail-protobuf4-compat.py").read_text(encoding="utf-8"))
          PY

      - name: Fetch deployment secrets from Doppler
        uses: DopplerHQ/secrets-fetch-action@cf794d40f721280fa2c068fa4f9e8afbc966e41d
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: autograder
          doppler-config: prd
          inject-env-vars: false

      - name: Validate deployment credentials and SSH host fingerprint
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_HOSTKEY: ${{ steps.doppler.outputs.DEPLOY_SSH_HOSTKEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PASSWORD DEPLOY_SSH_PORT DEPLOY_SSH_HOSTKEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Doppler secret $name is missing."
              exit 1
            fi
          done
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || {
            echo "::error::DEPLOY_SSH_PORT must be a valid TCP port."
            exit 1
          }
          port=$((10#$DEPLOY_SSH_PORT))
          (( port >= 1 && port <= 65535 )) || {
            echo "::error::DEPLOY_SSH_PORT must be a valid TCP port."
            exit 1
          }
          [[ "$DEPLOY_SSH_HOSTKEY" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || {
            echo "::error::DEPLOY_SSH_HOSTKEY must be a verified SHA256 fingerprint."
            exit 1
          }

      - name: Install OpenSSH password transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Pin the stored ED25519 host key
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_HOSTKEY: ${{ steps.doppler.outputs.DEPLOY_SSH_HOSTKEY }}
        run: |
          set -euo pipefail
          scan_file="$RUNNER_TEMP/autograder-hostkey-scan"
          known_hosts_file="$RUNNER_TEMP/autograder-known-hosts"
          ssh-keyscan -T 10 -p "$DEPLOY_SSH_PORT" -t ed25519 "$DEPLOY_SSH_HOST" \
            > "$scan_file" 2>/dev/null
          : > "$known_hosts_file"
          while IFS= read -r key_line; do
            read -r scanned_host key_type key_data _ <<<"$key_line"
            fingerprint="$(printf '%s %s\n' "$key_type" "$key_data" \
              | ssh-keygen -lf - -E sha256 | awk 'NR == 1 { print $2 }')"
            if [[ "$fingerprint" == "$DEPLOY_SSH_HOSTKEY" ]]; then
              printf '%s %s %s\n' "$scanned_host" "$key_type" "$key_data" \
                >> "$known_hosts_file"
            fi
          done < "$scan_file"
          if [[ ! -s "$known_hosts_file" ]]; then
            live_fingerprints="$(ssh-keygen -lf "$scan_file" -E sha256 2>/dev/null \
              | awk '{ print $2 }' | sort -u | paste -sd ',')"
            echo "::error::The live ED25519 host key does not match the pinned fingerprint."
            echo "Live ED25519 fingerprints: $live_fingerprints"
            exit 1
          fi
          chmod 0600 "$known_hosts_file"
          printf 'AUTOGRADER_SSH_KNOWN_HOSTS=%s\n' "$known_hosts_file" >> "$GITHUB_ENV"

      - name: Clear only empty upload and release directories from an interrupted first attempt
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s <<'REMOTE'
          set -euo pipefail
          root=/opt/autograder
          printf '%s\n' 'First-deploy state inventory (names and metadata only):'
          for path in \
            /opt/autograder \
            /etc/autograder \
            /var/lib/autograder \
            /var/lib/cloudflared \
            /var/cache/autograder/uv; do
            if [[ -e "$path" || -L "$path" ]]; then
              stat -c '%n %F %a %U:%G' "$path"
              if [[ -d "$path" && ! -L "$path" ]]; then
                find "$path" -mindepth 1 -maxdepth 2 \
                  -printf '  %P %y %m %u:%g\n' | LC_ALL=C sort
              fi
            fi
          done
          for user in autograder cloudflared; do
            if getent passwd "$user" >/dev/null; then
              getent passwd "$user" | cut -d: -f1,3,4,6,7
            fi
          done
          systemctl is-active autograder.service cloudflared.service 2>/dev/null || true
          docker volume ls --format '{{.Name}}' | LC_ALL=C sort | grep autograder || true
          if [[ ! -e "$root" && ! -L "$root" ]]; then
            exit 0
          fi
          [[ -d "$root" && ! -L "$root" ]] || {
            echo "::error::/opt/autograder is not a real directory."
            exit 1
          }
          if [[ -e "$root/current" || -L "$root/current" ]]; then
            exit 0
          fi
          unexpected="$(find "$root" -mindepth 1 -maxdepth 1 \
            ! -name python ! -name incoming ! -name staging ! -name releases -print -quit)"
          [[ -z "$unexpected" ]] || {
            echo "::error::/opt/autograder contains data from another state; refusing cleanup."
            exit 1
          }
          if [[ -e "$root/python" || -L "$root/python" ]]; then
            [[ -d "$root/python" && ! -L "$root/python" && \
              "$(stat -c %U "$root/python")" == autograder && \
              "$(stat -c %G "$root/python")" == autograder && \
              "$(stat -c %a "$root/python")" == 750 ]] || {
              echo "::error::/opt/autograder/python is not the managed Python runtime directory."
              exit 1
            }
          fi
          for directory in incoming staging releases; do
            path="$root/$directory"
            if [[ -e "$path" || -L "$path" ]]; then
              [[ -d "$path" && ! -L "$path" ]] || {
                echo "::error::$path is not a real directory."
                exit 1
              }
              [[ -z "$(find "$path" -mindepth 1 -print -quit)" ]] || {
                echo "::error::$path is not empty; refusing cleanup."
                exit 1
              }
            fi
          done
          for directory in incoming staging releases; do
            path="$root/$directory"
            if [[ -d "$path" ]]; then
              rmdir -- "$path"
            fi
          done
          if [[ -z "$(find "$root" -mindepth 1 -print -quit)" ]]; then
            rmdir -- "$root"
          fi
          REMOTE

      - name: Upload read-only server preflight
        if: github.event_name == 'push' || inputs.operation == 'preflight' || inputs.operation == 'deploy'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          preflight_dir="/tmp/autograder-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target="$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$preflight_dir/production-preflight.sh"
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            install -d -m 0700 "$preflight_dir"
          bash .github/scripts/deploy-ssh.sh scp \
            MAIN/scripts/production-preflight.sh "$target"

      - name: Run read-only server preflight
        if: github.event_name == 'push' || inputs.operation == 'preflight' || inputs.operation == 'deploy'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^[0-9]+$ ]]
          [[ "$2" =~ ^[1-9][0-9]*$ ]]
          preflight_dir="/tmp/autograder-preflight-$1-$2"
          trap 'rm -rf -- "$preflight_dir"' EXIT
          bash "$preflight_dir/production-preflight.sh"
          REMOTE

      - name: Prepare private incoming directory
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        id: prepare
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^[a-f0-9]{40}$ ]]
          install -d -o root -g root -m 0755 /opt/autograder /opt/autograder/incoming /opt/autograder/staging
          install -d -o root -g root -m 0700 "/opt/autograder/incoming/$1"
          REMOTE

      - name: Create source archive
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        run: git archive --format=tar.gz --output=autograder.tar.gz "$GITHUB_SHA"

      - name: Render server runtime environment
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          POSTGRES_PASSWORD: ${{ steps.doppler.outputs.POSTGRES_PASSWORD }}
          B2_DB_PASSWORD: ${{ steps.doppler.outputs.B2_DB_PASSWORD }}
          B3_APP_DB_PASSWORD: ${{ steps.doppler.outputs.B3_APP_DB_PASSWORD }}
          B3_INTERNAL_DB_PASSWORD: ${{ steps.doppler.outputs.B3_INTERNAL_DB_PASSWORD }}
          B4_DB_PASSWORD: ${{ steps.doppler.outputs.B4_DB_PASSWORD }}
          B2_B3_SERVICE_TOKEN: ${{ steps.doppler.outputs.B2_B3_SERVICE_TOKEN }}
        run: node MAIN/deploy/write-runtime-env.mjs runtime.env setup.env "$GITHUB_SHA"

      - name: Upload release and runtime environment
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ssh.sh scp \
            autograder.tar.gz runtime.env setup.env \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/opt/autograder/incoming/$GITHUB_SHA/"

      - name: Remove local secret files
        if: always()
        run: rm -f runtime.env setup.env autograder.tar.gz

      - name: Deploy native API service
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^[a-f0-9]{40}$ ]]
          [[ "$2" =~ ^[1-9][0-9]*$ ]]
          stage="/opt/autograder/staging/$1-$2"
          install -d -o root -g root -m 0750 "$stage"
          tar -xzf "/opt/autograder/incoming/$1/autograder.tar.gz" -C "$stage"
          bash "$stage/MAIN/deploy/deploy-release.sh" "$1" "$stage"
          REMOTE

      - name: Remove failed or incomplete remote upload
        if: ${{ always() && steps.prepare.outcome == 'success' && (github.event_name == 'push' || inputs.operation == 'deploy') }}
        env:
          DEPLOY_SSH_HOST: ${{ steps.doppler.outputs.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ steps.doppler.outputs.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ steps.doppler.outputs.DEPLOY_SSH_PASSWORD }}
          DEPLOY_SSH_PORT: ${{ steps.doppler.outputs.DEPLOY_SSH_PORT }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ssh.sh ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            bash -s -- "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          [[ "$1" =~ ^[a-f0-9]{40}$ ]]
          [[ "$2" =~ ^[1-9][0-9]*$ ]]
          incoming="/opt/autograder/incoming/$1"
          stage="/opt/autograder/staging/$1-$2"
          if [[ -d "$incoming" && "$incoming" == /opt/autograder/incoming/* ]]; then
            rm -rf -- "$incoming"
          fi
          if [[ -d "$stage" && "$stage" == /opt/autograder/staging/* ]]; then
            rm -rf -- "$stage"
          fi
          for directory in /opt/autograder/incoming /opt/autograder/staging \
              /opt/autograder/releases /opt/autograder; do
            if [[ -d "$directory" && ! -L "$directory" ]] && \
                [[ -z "$(find "$directory" -mindepth 1 -print -quit)" ]]; then
              rmdir -- "$directory"
            fi
          done
          REMOTE
