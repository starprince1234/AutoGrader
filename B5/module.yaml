schema_version: 1
module: B5
contract_version: 0.24.0
entry_point: autograder_b5.plugin:create_module
provides: [b5-conformance]
# `b4-auth` because the contract's endpoint is bearer-protected and B5 verifies the token
# locally. `b2-submissions` / `b3-questions` because the report compares the contract against
# the *loaded* modules: without them the answer is not "this composition is consistent" but
# "most of the contract is served by nobody", which is a wrong report rather than a small one.
requires: [host, b2-submissions, b3-questions, b4-auth]
routes: [/api/v1/platform]
events:
  publishes: []
  subscribes: []
database:
  schema: none
  migration_head: none
