openapi: 3.1.0
info:
  title: AutoGrader B4 Platform API
  version: 0.34.0
  description: |
    Identity, courses, sections, enrollments, roster import, audit and the runtime
    module registry. Owned by B4 (RQ-B-4-10/20/30/40/50/99).

    Ownership split for RQ-B-4-40: this file is authored by MAIN (design-time
    authority); B4 owns the *runtime* registry endpoints defined here. See
    MAIN/docs/adr/ADR-0003-api-authority-and-runtime-registry.md.

    Every path below is declared in B4/module.yaml `routes`.
  license:
    name: Course project (internal)
servers:
  - url: /
    description: Served by the MAIN composition host, same origin as the B1 client.

# Document-level default: every B4 operation requires a bearer access token.
# Session/JWKS, self-service registration and password-reset operations are public by
# design and say so individually:
#   * `createSession`  — credentials are in the body; there is nothing to authenticate yet.
#   * `refreshSession` — authenticated by the HttpOnly refresh cookie, not by a bearer token.
#   * `getJwks`        — every module verifies tokens locally, so the key set must be readable
#                        without a token (it is public key material and reveals nothing).
#   * registration / password-reset — the caller has no account/session yet; the e-mailed
#                        code is what proves the mailbox.
security:
  - bearerAuth: []

paths:
  /api/v1/auth/session:
    post:
      operationId: createSession
      summary: Authenticate and open a session
      description: |
        Verifies credentials, returns a short-lived Ed25519 access token, and sets the
        refresh credential as an HttpOnly + Secure + SameSite cookie. The refresh
        credential is never returned in the response body. Failures do not reveal
        whether the principal exists.
      tags: [auth]
      security: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Traceparent'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, minLength: 1, maxLength: 200}
                password: {type: string, minLength: 1, maxLength: 400, format: password}
              additionalProperties: false
      responses:
        '200':
          description: Session created.
          headers:
            Set-Cookie:
              schema: {type: string}
              description: "HttpOnly; Secure; SameSite refresh credential. Never exposed to JavaScript."
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, username, roles, scope]
                properties:
                  access_token: {type: string, description: "Short-lived Ed25519 JWT."}
                  token_type: {type: string, const: Bearer}
                  expires_in: {type: integer, minimum: 1}
                  username:
                    type: string
                    description: |
                      Login identifier of the authenticated principal. The token itself
                      carries only `sub` (a UUID) by design, so without this field a
                      client cannot say *who* is signed in after a refresh -- the header
                      rendered "-" until integration caught it.
                  roles:
                    type: array
                    items: {$ref: './common.yaml#/components/schemas/Role'}
                  scope:
                    type: array
                    items: {$ref: './common.yaml#/components/schemas/CourseScope'}
                additionalProperties: false
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}
        '429': {$ref: './common.yaml#/components/responses/TooManyRequests'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}

  /api/v1/auth/session/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh credential and issue a new access token
      tags: [auth]
      security: []
      responses:
        '200':
          description: Access token reissued; the refresh credential is rotated.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, username, roles, scope]
                properties:
                  access_token: {type: string}
                  token_type: {type: string, const: Bearer}
                  expires_in: {type: integer, minimum: 1}
                  username:
                    type: string
                    description: "See createSession: the principal's login name, so a refreshed page can still show who is signed in."
                  roles:
                    type: array
                    items: {$ref: './common.yaml#/components/schemas/Role'}
                  scope:
                    type: array
                    items: {$ref: './common.yaml#/components/schemas/CourseScope'}
                additionalProperties: false
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}

  /api/v1/auth/session/logout:
    delete:
      operationId: deleteSession
      summary: Invalidate the current session
      tags: [auth]
      responses:
        '204': {description: Session invalidated.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}

  /api/v1/auth/jwks:
    get:
      operationId: getJwks
      summary: Publish the Ed25519 public keys
      description: |
        Every module verifies tokens locally against this key set instead of calling
        B4 on the request path. Keys are identified by `kid` and rotated from the
        runbook procedure.
      tags: [auth]
      security: []
      responses:
        '200':
          description: JWK Set.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, crv, kid, x]
                      properties:
                        kty: {type: string, const: OKP}
                        crv: {type: string, const: Ed25519}
                        kid: {type: string}
                        x: {type: string}
                        use: {type: string, const: sig}
                        alg: {type: string, const: EdDSA}
                      additionalProperties: true
                additionalProperties: false

  /api/v1/auth/registrations/code:
    post:
      operationId: requestRegistrationCode
      summary: Send the e-mail verification code for a self-service registration
      description: |
        Self-service registration is open (no approval step): the caller proves the
        mailbox, the identity is checked against the administrator's allowlist, and the
        account created by `createRegistration` can sign in immediately.

        This operation validates the claimed identity (13-digit student number, full
        name present in the allowlist) **before** sending anything, so a code is never
        mailed for an identity that cannot register. It stores only a SHA-256 digest of
        the code, bound to the exact registration intent, and it never stores the
        password. A missing or failing SMTP configuration is `503`: the endpoint never
        degrades to skipping verification.
      tags: [auth]
      security: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Traceparent'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, student_number, display_name]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: '^[a-z][a-z0-9._-]{2,31}$'
                  description: Login identifier. Lowercase; must not contain "@".
                email: {type: string, format: email, maxLength: 320}
                student_number: {type: string, pattern: '^[0-9]{13}$'}
                display_name: {type: string, minLength: 1, maxLength: 50}
              additionalProperties: false
      responses:
        '202':
          description: Code sent (or the same answer when one was already in flight).
          content:
            application/json:
              schema:
                type: object
                required: [expires_in_seconds, resend_after_seconds]
                properties:
                  expires_in_seconds: {type: integer, minimum: 1}
                  resend_after_seconds: {type: integer, minimum: 1}
                additionalProperties: false
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}
        '429': {$ref: './common.yaml#/components/responses/TooManyRequests'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}

  /api/v1/auth/registrations:
    post:
      operationId: createRegistration
      summary: Complete a self-service registration with the e-mailed code
      description: |
        Verifies the code against the intent stored by `requestRegistrationCode`, then
        creates the account in one transaction: `b4.users`, `b4.credentials` (Argon2id),
        the platform `student` role, and a link for every roster enrollment that already
        carries this student number but no user yet. The account is usable immediately —
        there is no approval state.

        The request repeats the e-mail only as a lookup key; the username, student number
        and display name come from the stored intent so that "what was verified" and
        "what is created" cannot diverge.
      tags: [auth]
      security: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Traceparent'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email: {type: string, format: email, maxLength: 320}
                code: {type: string, pattern: '^[0-9]{6}$'}
                password: {type: string, minLength: 8, maxLength: 128, format: password}
              additionalProperties: false
      responses:
        '201':
          description: |
            Account created; the caller can sign in immediately. The response also reports
            what the account was bound to, so "registered but sees no course" is answerable
            without a second call: `bound_course_count` is the number of active roster rows
            linked to this account (one per course), `identity_mismatch_count` counts rows
            whose recorded name differs from the verified registration name. Mismatched rows
            are deliberately **not** bound: binding two differently-named records by student
            number alone would merge two people, so the teacher must correct the roster.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, username, bound_course_count, identity_mismatch_count]
                properties:
                  user_id: {type: string, format: uuid}
                  username: {type: string}
                  bound_course_count: {type: integer, minimum: 0}
                  identity_mismatch_count: {type: integer, minimum: 0}
                additionalProperties: false
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}
        '429': {$ref: './common.yaml#/components/responses/TooManyRequests'}

  /api/v1/auth/password-reset/code:
    post:
      operationId: requestPasswordResetCode
      summary: Send the e-mail verification code for a password reset
      description: |
        Starts a password reset for the account carrying this registered e-mail address.
        The answer is deliberately identical for every syntactically valid address, whether
        or not an active account exists, so this endpoint cannot be used to enumerate
        accounts: a code is mailed only when the address belongs to an active account.
        It stores only a SHA-256 digest bound to the reset intent and never stores the
        plaintext code.

        The TTL, resend window and hourly limits are the same mail-channel limits used by
        `requestRegistrationCode`. A missing or failing SMTP configuration is `503`, and
        no code is persisted in that case.
      tags: [auth]
      security: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Traceparent'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 320}
              additionalProperties: false
      responses:
        '202':
          description: |
            Same answer whether or not the address belongs to an active account. A code is
            sent only in the latter case.
          content:
            application/json:
              schema:
                type: object
                required: [expires_in_seconds, resend_after_seconds]
                properties:
                  expires_in_seconds: {type: integer, minimum: 1}
                  resend_after_seconds: {type: integer, minimum: 1}
                additionalProperties: false
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}

  /api/v1/auth/password-reset:
    post:
      operationId: completePasswordReset
      summary: Replace the password using the e-mailed reset code
      description: |
        Consumes the code issued by `requestPasswordResetCode` exactly once, replaces the
        Argon2id credential, and revokes every refresh session of the account. Access
        tokens already issued remain valid only until their short TTL; the next refresh
        fails and the browser must sign in again with the new password.

        Every code rejection (unknown address, missing/expired code, wrong code, attempts
        exhausted) uses the same `422` detail, for the same anti-enumeration reason as the
        code request. The plaintext password and code never enter a log line or an audit
        record.
      tags: [auth]
      security: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Traceparent'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email: {type: string, format: email, maxLength: 320}
                code: {type: string, pattern: '^[0-9]{6}$'}
                new_password: {type: string, minLength: 8, maxLength: 128, format: password}
              additionalProperties: false
      responses:
        '204': {description: Password replaced; every refresh session of the account revoked.}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}

  /api/v1/registration-allowlists/batches:
    get:
      operationId: listRegistrationAllowlistBatches
      summary: List every imported allowlist (one per class)
      description: |
        Each uploaded file is a **class**; the class name is the file name. Listing them is what
        lets an administrator keep several cohorts on the platform at once instead of replacing
        one snapshot with another.
      tags: [registration]
      responses:
        '200':
          description: Batches, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AllowlistBatch'}
                additionalProperties: false
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}

  /api/v1/registration-allowlists/batches/{batch_id}/entries:
    parameters:
      - {name: batch_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    get:
      operationId: listRegistrationAllowlistEntries
      summary: Students of one class, ordered by student number
      tags: [registration]
      responses:
        '200':
          description: Entries of the batch.
          content:
            application/json:
              schema:
                type: object
                required: [batch_id, items]
                properties:
                  batch_id: {$ref: './common.yaml#/components/schemas/Uuid'}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AllowlistEntry'}
                additionalProperties: false
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/registration-allowlists/batches/{batch_id}:
    parameters:
      - {name: batch_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    delete:
      operationId: deleteRegistrationAllowlistBatch
      summary: Delete a whole class (its students lose the right to register)
      description: |
        Deleting a class must not silently keep its students registrable: the entries are removed
        with the batch, so a student who is no longer in any class can no longer self-register.
        Accounts already created are unaffected -- they are users, not allowlist rows.
      tags: [registration]
      responses:
        '204': {description: Deleted.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/registration-allowlists/entries/{entry_id}:
    parameters:
      - {name: entry_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    delete:
      operationId: deleteRegistrationAllowlistEntry
      summary: Remove one student from a class
      tags: [registration]
      responses:
        '204': {description: Removed.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/registration-allowlists:
    post:
      operationId: addRegistrationAllowlistBatch
      summary: Replace the registration allowlist from a CSV file (admin only)
      description: |
        The CSV carries the identity anchor used by self-service registration: a
        `姓名`/`学号` header (a `name`/`student_number` header is accepted too) and one
        row per student. The upload **replaces** the allowlist in one transaction: rows
        absent from the new file can no longer register, and previous batches stay
        recorded for traceability.

        Encoding: UTF-8 (with or without BOM) or GBK/GB18030. A file that decodes into
        something other than 13-digit student numbers is rejected rather than imported
        partially. Columns are located by header name, never by position.
      tags: [registration]
      parameters:
        - $ref: './common.yaml#/components/parameters/Traceparent'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
              additionalProperties: false
      responses:
        '200':
          description: Allowlist batch added (or the same-named class replaced).
          content:
            application/json:
              schema:
                type: object
                required: [batch_id, class_name, row_count, skipped_row_count, replaced, content_sha256]
                properties:
                  batch_id: {type: string, format: uuid}
                  #: 班级名来自文件名（去掉扩展名）。
                  class_name: {type: string}
                  #: 实际写入的学生人数（不是文件行数：与其他班级重复的学号会被跳过）。
                  row_count: {type: integer, minimum: 0}
                  #: 因"已在其他班级中"而跳过的行数。
                  skipped_row_count: {type: integer, minimum: 0}
                  duplicate_student_numbers:
                    type: array
                    items: {type: string}
                    maxItems: 20
                  #: 同名班级已存在时为 true，表示这次是**更新**该班而不是新增一个班。
                  replaced: {type: boolean}
                  content_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                additionalProperties: false
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '413': {$ref: './common.yaml#/components/responses/PayloadTooLarge'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}
    get:
      operationId: getRegistrationAllowlist
      summary: Report the active registration allowlist (admin only)
      tags: [registration]
      parameters:
        - $ref: './common.yaml#/components/parameters/Traceparent'
        - $ref: './common.yaml#/components/parameters/RequestId'
      responses:
        '200':
          description: The active batch, or nulls when none was ever imported.
          content:
            application/json:
              schema:
                type: object
                required: [batch_id, filename, row_count, uploaded_at]
                properties:
                  batch_id: {type: [string, 'null'], format: uuid}
                  filename: {type: [string, 'null']}
                  row_count: {type: integer, minimum: 0}
                  uploaded_at: {type: [string, 'null'], format: date-time}
                additionalProperties: false
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}

  /api/v1/internal/identities/by-email:
    get:
      operationId: lookupIdentityByEmail
      summary: Resolve a registered e-mail address to its account (internal)
      description: |
        Purpose: the mail intake (B2) receives a message whose sender is an e-mail address, and
        must turn that address into the account that submitted the work. B4 owns the address,
        so the lookup lives here rather than duplicating a copy of the user table in B2.

        Why an internal endpoint rather than a wider teacher-facing one: this answers "which
        account has this address" for **any** address on the platform, which is exactly the
        question an enumeration attack wants. It therefore requires the pre-shared service
        credential and is never reachable with a user session.

        The response deliberately omits the address itself: the caller already knows the
        address it asked about, and echoing it back would put a second copy of personal data
        into B2's database for no functional gain.

        Not found is `404`, not an empty object: the intake turns that into a quarantine record
        ("sender does not match any account"), which is a decision it can only make if "no such
        account" is distinguishable from "malformed request".
      tags: [internal, users]
      security: [{serviceToken: []}]
      parameters:
        - name: email
          in: query
          required: true
          schema: {type: string, minLength: 3, maxLength: 320}
          description: The sender address, matched case-insensitively after trimming.
      responses:
        '200':
          description: The account registered with that address.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InternalIdentity'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}

  /api/v1/internal/users/{user_id}/authorization:
    parameters:
      - {name: user_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    get:
      operationId: getInternalUserAuthorization
      summary: Current effective roles and course membership of one account (internal)
      description: |
        Purpose (v0.32.0): the assignment, submission and grade APIs must decide access from
        the caller's **current** effective membership, but the authoritative facts (roles,
        active course enrollment, section, class) belong to B4. A JWT `scope` claim is only a
        snapshot taken when the token was issued: a student added to a course after sign-in
        would be invisible to the token, and a student removed from a course would keep access
        until the token expires. B3 and B2 therefore ask this endpoint at request time instead
        of trusting the token's scope.

        Returns identifiers only -- no name, e-mail address or student number. Being internal
        is not authorization: the caller must present the pre-shared `serviceToken`.
      tags: [internal]
      security: [{serviceToken: []}]
      responses:
        '200':
          description: The account's current roles and memberships.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InternalUserAuthorization'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/internal/assignment-notifications:
    post:
      operationId: createAssignmentNotifications
      summary: Materialise the publication notification of one assignment (internal)
      description: |
        Called by B3 once an assignment is published; the B3 side retries because a transient
        failure must not lose the notification. The call is **idempotent by `assignment_id`**:
        a repeat returns the already materialised summary and never duplicates recipients or
        sends anything twice. Delivery itself is performed by the B4 notification sender
        (`python -m autograder_b4.ops.notifications`), which is why this endpoint only records
        what must be sent and every recipient's status.

        The audience is the course's current active roster. Unregistered students, students
        whose account has no e-mail address, and deactivated accounts are recorded with
        distinct skipped statuses and reason codes; "no notification" is therefore never
        reported as "delivered".
      tags: [internal, notifications]
      security: [{serviceToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignmentNotificationRequest'}
      responses:
        '200':
          description: A notification for this assignment already existed; nothing changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentNotificationSummary'}
        '201':
          description: Recipients materialised; delivery is pending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentNotificationSummary'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}

  /api/v1/courses/{course_id}/assignments/{assignment_id}/notifications:
    parameters:
      - {name: course_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
      - {name: assignment_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    get:
      operationId: getAssignmentNotifications
      summary: Delivery status of one assignment notification (staff)
      description: |
        Staff-only (write access to the course). Returns the campaign summary plus one row per
        intended recipient, including the students that could not be notified and why. The
        delivery list is a cursor page so a large course is never presented as a partial list.
        `404` means B4 has no notification for this assignment id; it does not say whether the
        assignment exists -- assignments are owned by B3 and are not checked here.
      tags: [notifications]
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
        - name: kind
          in: query
          required: false
          description: |
            Which campaign to read. `publication` (default) is the announcement materialised when
            the assignment was published; `reminder` is the teacher's later nudge created by
            `/notifications/remind`. Each campaign keeps its own recipient snapshot and its own
            delivery evidence, so a reminder's failures can be read and retried on their own
            without disturbing the announcement.
          schema:
            type: string
            enum: [publication, reminder]
            default: publication
      responses:
        '200':
          description: The notification summary and one delivery page.
          content:
            application/json:
              schema:
                type: object
                required: [summary, deliveries]
                properties:
                  summary: {$ref: '#/components/schemas/AssignmentNotificationSummary'}
                  deliveries:
                    allOf:
                      - $ref: './common.yaml#/components/schemas/CursorPage'
                      - type: object
                        properties:
                          items:
                            type: array
                            items: {$ref: '#/components/schemas/AssignmentNotificationDelivery'}
                additionalProperties: false
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/courses/{course_id}/assignments/{assignment_id}/notifications/retry:
    parameters:
      - {name: course_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
      - {name: assignment_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    post:
      operationId: retryAssignmentNotifications
      summary: Re-arm failed deliveries of one assignment notification (staff)
      description: |
        Only rows in `failed` are reset to `pending` (attempts cleared, `next_attempt_at` set
        to now); the sender will try them again on its next pass. Rows skipped because the
        student has no account, no address or an inactive account are **not** retried: sending
        again cannot fix those reasons, and pretending otherwise would hide them. Returns the
        updated summary.
      tags: [notifications]
      parameters:
        - name: kind
          in: query
          required: false
          description: |
            Which campaign to read. `publication` (default) is the announcement materialised when
            the assignment was published; `reminder` is the teacher's later nudge created by
            `/notifications/remind`. Each campaign keeps its own recipient snapshot and its own
            delivery evidence, so a reminder's failures can be read and retried on their own
            without disturbing the announcement.
          schema:
            type: string
            enum: [publication, reminder]
            default: publication
      responses:
        '200':
          description: The updated notification summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentNotificationSummary'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/courses/{course_id}/assignments/{assignment_id}/notifications/remind:
    parameters:
      - {name: course_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
      - {name: assignment_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    post:
      operationId: remindAssignmentStudents
      summary: Remind the students who have not submitted yet (staff)
      description: |
        Staff-only (write access to the course). Creates one **reminder campaign** for the
        given enrollments and returns its summary; delivery is the same resumable sender pass
        that delivers the publication notification, so `sent` is still only written after the
        SMTP server accepted the message.

        The reminder text has two parts and only the second is a caller input:
        * a **server-composed prompt** naming the course, the assignment and the due time
          ("please finish it in the platform"). It is generated here, so a client cannot
          remove or rewrite it -- that is what "自动包括提示语" means;
        * an optional `note` from the teacher, appended after the prompt.

        Reminders are separate from the publication notification on purpose: a campaign is a
        record of "I told this audience at this moment", and its per-recipient delivery rows
        are the evidence. Repeating the call creates a new campaign (a second reminder), which
        is why recipient counts must be read per campaign rather than assumed idempotent.

        `enrollment_ids` outside the course's current active roster are **refused with 422**
        rather than silently dropped: sending to an unknown id would notify the wrong person,
        and silently ignoring it would let a stale UI believe the reminder reached everyone.
        Rows that cannot be reached (no account, no address, inactive account) are recorded as
        skipped with a reason, exactly like the publication notification.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignmentReminderRequest'}
      responses:
        '200':
          description: The reminder campaign summary created by this call.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentNotificationSummary'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}

  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Read the caller's own account facts
      description: |
        Returns the caller's own row only: no e-mail address and no other user's data. Since
        v0.32.0 it also carries `memberships` (the caller's active course/section/class
        enrollments), which is the only way a student can be shown "which courses, which
        课序 and which 班级 am I in" without a staff-only roster endpoint.
        Every authenticated caller may read only themselves.
      tags: [auth, users]
      responses:
        '200':
          description: The caller's account facts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}

  /api/v1/users:
    get:
      operationId: listUsers
      summary: List platform users (admin only)
      tags: [users]
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
        - name: role
          in: query
          required: false
          schema: {$ref: './common.yaml#/components/schemas/Role'}
          description: |
            Restrict the page to holders of that **platform** role (a course-scoped grant is
            not a platform role). The filter selects rows; it never widens what a row shows.
            There is no name/username search: the contract declares none, and a client that
            pulled the whole table to filter locally would spread identity data for a feature
            the server does not offer.
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
    post:
      operationId: createUser
      summary: Create a platform user (admin only)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, username, roles]
              properties:
                display_name: {type: string, minLength: 1, maxLength: 200}
                username: {type: string, minLength: 1, maxLength: 200}
                student_number: {type: [string, "null"], maxLength: 64}
                email: {type: [string, "null"], format: email, maxLength: 320}
                roles:
                  type: array
                  minItems: 1
                  items: {$ref: './common.yaml#/components/schemas/Role'}
                password: {type: string, format: password, description: "Hashed with Argon2id or bcrypt at rest; never logged."}
              additionalProperties: false
      responses:
        '201':
          description: |
            User created. The body carries the identity of the new account so an admin
            screen can name what it created (`RQ-B-4-50`): it is not a credential and it
            is not a second read of the user — a client that wants the full row still
            re-reads the list.
          content:
            application/json:
              schema:
                type: object
                required: [user_id]
                properties:
                  user_id: {$ref: './common.yaml#/components/schemas/Uuid'}
                additionalProperties: false
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}

  /api/v1/users/{user_id}:
    parameters:
      - {name: user_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    patch:
      operationId: updateUser
      summary: Update a user or reassign roles (admin only)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string, minLength: 1, maxLength: 200}
                email: {type: [string, "null"], format: email, maxLength: 320}
                roles:
                  type: array
                  items: {$ref: './common.yaml#/components/schemas/Role'}
                expected_updated_at:
                  allOf: [{$ref: './common.yaml#/components/schemas/Timestamp'}]
                  description: "Optimistic concurrency guard; a mismatch returns 409 rather than silently overwriting."
              additionalProperties: false
      responses:
        '200': {description: User updated; an audit record is written.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}
    delete:
      operationId: deleteUser
      summary: Deactivate a user (admin only)
      description: |
        **Deactivation, not deletion.** The row, its historical records and the accounts it
        owns stay in place; `is_active` becomes `false` and every open session of that user is
        revoked, so the account can no longer sign in. An administrator whose own row this is
        gets `409`: deactivating yourself would end the session that is performing the request
        and can leave the platform without an active administrator. The opposite direction is
        `activateUser`; this verb never revives an account by itself.
      tags: [users]
      responses:
        '204': {description: User deactivated; an audit record is written.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
          description: |
            Refused because the target is the caller's own account. Deactivation revokes the
            caller's sessions, so the operation cannot be reported back to the actor that
            asked for it; a second administrator has to perform it.

  /api/v1/users/{user_id}/activate:
    parameters:
      - {name: user_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    post:
      operationId: activateUser
      summary: Re-activate a deactivated user (admin only)
      description: |
        **Soft re-activation, the inverse of `deleteUser`.** `is_active` becomes `true`, the
        deactivation timestamp is cleared and the account may sign in again; the row, its
        historical records and every course membership stay untouched, so reviving an account
        never rewrites history or re-creates enrollments. `updated_at` advances, which is what
        a concurrent editor compares against.

        The self-service rule is symmetric with `deleteUser`: an administrator whose own row
        this is gets `409`. State changes on the account performing the request are refused in
        both directions, so no single administrator can lock or unlock themselves.
      tags: [users]
      responses:
        '204': {description: User re-activated; an audit record is written.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
          description: |
            Refused because the target is the caller's own account. Activation mirrors
            deactivation: the state of the account performing the request cannot be changed by
            that request, so a second administrator has to perform it.

  /api/v1/courses:
    get:
      operationId: listCourses
      summary: List courses within the caller's authorization scope
      tags: [courses]
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Page of courses.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/CoursePublic'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
    post:
      operationId: createCourse
      summary: Create a course (teacher or admin)
      tags: [courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                course_code:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 64
                  description: |
                    Optional label. Omit it (or send null) and the course has no code; the course
                    is still identified by `course_id`, which is what rosters, assignments and
                    exports use. Codes that are present must be unique.
                title: {type: string, minLength: 1, maxLength: 200}
              additionalProperties: false
      responses:
        '201':
          description: Course created; the body is the stored course.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoursePublic'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}

  /api/v1/courses/{course_id}:
    parameters:
      - {name: course_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    patch:
      operationId: updateCourse
      summary: Rename a course (teacher of that course, or admin)
      description: |
        Only the title is writable. The course code is an identity: rosters, assignments and
        exports match on it, so renaming it in place would silently break references rather than
        rename a course. A wrong code is fixed by creating the right course, not by editing this
        one.

        `expected_updated_at` is an optimistic lock. Two teachers renaming the same course at the
        same time must not have one edit vanish; the stale writer gets `409` and re-reads.
      tags: [courses]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseRename'}
      responses:
        '200':
          description: The course as stored after the rename.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoursePublic'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409':
          description: |
            The course changed since `expected_updated_at` (someone else renamed it first).
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}
    delete:
      operationId: deleteCourse
      summary: Retire a course (soft delete)
      description: |
        The row is kept and marked inactive: submissions, grades and audit records refer to the
        course by id, so removing it outright would leave history pointing at nothing. The course
        disappears from `listCourses`, which is what "deleted" means for the teacher.
      tags: [courses]
      responses:
        '204': {description: Retired.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/courses/{course_id}/sections:
    parameters:
      - {name: course_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    get:
      operationId: listSections
      summary: List sections (课序) of a course
      tags: [courses]
      responses:
        '200':
          description: Sections of the course, ordered by section code.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SectionPublic'}
                additionalProperties: false
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
  /api/v1/courses/{course_id}/sections/{section_id}:
    parameters:
      - {name: course_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
      - {name: section_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    delete:
      operationId: deleteSection
      summary: Delete a section together with its classes and roster rows
      description: |
        A `stop` section groups classes (班级); deleting it removes its classes and their
        roster rows. Assignments are course-scoped since v0.32.0, so no assignment target
        references a section any more -- there is nothing left to dangle.
      tags: [courses]
      responses:
        '204': {description: Deleted.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

    post:
      operationId: createSection
      summary: Create a section (teacher or admin)
      tags: [courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section_code]
              properties:
                section_code: {type: string, minLength: 1, maxLength: 64}
                term: {type: [string, "null"], maxLength: 64}
              additionalProperties: false
      responses:
        '201':
          description: Section created; the body is the stored section.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SectionPublic'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}

  /api/v1/sections/{section_id}/classes:
    parameters:
      - {name: section_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    get:
      operationId: listClasses
      summary: List the classes (班级) of one section
      tags: [courses]
      responses:
        '200':
          description: Classes of the section, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ClassPublic'}
                additionalProperties: false
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    post:
      operationId: createClass
      summary: Create one class inside an existing section
      description: |
        A section (课序) contains one or more classes (班级); creating a class never creates a
        section. Several classes that were already registered (registration allowlist batches)
        can therefore be attached to the **same** existing section.

        When `batch_id` is present the class starts with that registered class's students,
        copied as unbound roster rows; an account that already exists for a student number is
        linked immediately. Re-attaching the same batch to the same section returns the
        existing class (idempotent) instead of duplicating rows.

        The request is refused with `409` when any of those students is already actively
        enrolled in this course in a different section/class: one student may belong to at
        most one active section per course, and the server never picks one silently. The
        whole request rolls back; nothing half-written remains.
      tags: [courses]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClassCreate'}
      responses:
        '201':
          description: The created (or already attached) class.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassPublic'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}

  /api/v1/classes/{class_id}:
    parameters:
      - {name: class_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    patch:
      operationId: renameClass
      summary: Rename one class
      tags: [courses]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClassRename'}
      responses:
        '200':
          description: The stored class.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassPublic'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
    delete:
      operationId: deleteClass
      summary: Delete one class together with its roster rows
      tags: [courses]
      responses:
        '204': {description: Deleted.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/classes/{class_id}/enrollments:
    parameters:
      - {name: class_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    get:
      operationId: listClassEnrollments
      summary: List the roster of one class
      tags: [courses]
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Page of enrollments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/EnrollmentPublic'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/courses/{course_id}/enrollments:
    parameters:
      - {name: course_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    get:
      operationId: listCourseEnrollments
      summary: Page through the complete roster of a course
      description: |
        The teacher's course-wide roster: every active enrollment of every section and class,
        including students without an account (`student_id` null) and their class/section.
        This is the read a teacher detail page must page through completely; deriving the
        roster from one class or one section would present a partial list as the audience.
      tags: [courses]
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
        - {name: section_id, in: query, required: false, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
        - {name: class_id, in: query, required: false, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
      responses:
        '200':
          description: Page of enrollments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/EnrollmentPublic'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/courses/{course_id}/roster-summary:
    parameters:
      - {name: course_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    get:
      operationId: getCourseRosterSummary
      summary: Server-computed audience counts for one course
      description: |
        Counts are computed in SQL over the whole course, not summed from a client page: a
        teacher's "how many students are in this course" answer must not depend on how many
        pages the browser happened to load.
      tags: [courses]
      responses:
        '200':
          description: Course roster summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RosterSummary'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/sections/{section_id}/enrollments:
    parameters:
      - {name: section_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    get:
      operationId: listEnrollments
      summary: List the roster of a section
      description: Returns student identity fields only to callers authorized for the section.
      tags: [courses]
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Page of enrollments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/EnrollmentPublic'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/enrollments/{enrollment_id}:
    parameters:
      - {name: enrollment_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    patch:
      operationId: updateEnrollment
      summary: Edit a roster entry (RQ-B-1-20)
      description: |
        Requires write permission for the section. Concurrency is guarded by
        expected_updated_at; a mismatch returns 409 instead of overwriting. Every
        successful edit writes an audit record with the actor, target and a digest
        of the before/after values.
      tags: [courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_number: {type: string, maxLength: 64}
                display_name: {type: string, minLength: 1, maxLength: 200}
                expected_updated_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
              additionalProperties: false
      responses:
        '200': {description: Enrollment updated.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}
    delete:
      operationId: deleteEnrollment
      summary: Remove a roster entry
      tags: [courses]
      responses:
        '204': {description: Enrollment removed; an audit record is written.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/roster-imports:
    post:
      operationId: createRosterImport
      summary: Upload a roster file and start parsing (RQ-B-1-10)
      description: |
        Accepts a CSV or XLSX roster for one **class**: the caller names the course, the
        section (课序) and the class (班级) the file belongs to, and the server verifies that
        the class belongs to that section and the section to that course. Parsing never
        guesses: when a column cannot be mapped unambiguously the import stops in
        `mapping_required` and waits for a human decision. No roster row is persisted
        before confirmation.
      tags: [roster]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, course_id, section_id, class_id]
              properties:
                file: {type: string, format: binary}
                course_id: {$ref: './common.yaml#/components/schemas/Uuid'}
                section_id: {$ref: './common.yaml#/components/schemas/Uuid'}
                class_id: {$ref: './common.yaml#/components/schemas/Uuid'}
              additionalProperties: false
      responses:
        '202':
          description: Import accepted for parsing.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RosterImportPreview'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '413': {$ref: './common.yaml#/components/responses/PayloadTooLarge'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}

  /api/v1/roster-imports/{roster_import_id}:
    parameters:
      - {name: roster_import_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    get:
      operationId: getRosterImport
      summary: Read the parse preview and per-row validation result
      tags: [roster]
      responses:
        '200':
          description: Current import state and preview. Rejected rows are always listed, never dropped silently.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RosterImportPreview'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /api/v1/roster-imports/{roster_import_id}/mapping:
    parameters:
      - {name: roster_import_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    put:
      operationId: setRosterColumnMapping
      summary: Confirm or correct the column mapping
      description: "Required when the import is in `mapping_required`; the mapping is recorded for traceability."
      tags: [roster]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columns]
              properties:
                columns:
                  type: object
                  description: "Map of target field name to source column header."
                  additionalProperties: {type: string}
              additionalProperties: false
      responses:
        '200': {description: Mapping accepted; validation runs again.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}

  /api/v1/roster-imports/{roster_import_id}/confirm:
    parameters:
      - {name: roster_import_id, in: path, required: true, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
    post:
      operationId: confirmRosterImport
      summary: Commit the previewed roster atomically (RQ-B-1-10)
      description: |
        Idempotent: repeating the confirmation does not duplicate rows. Atomic: either
        every accepted row is written or none is. Emits
        `autograder.v1.roster.import.completed` on success; the payload carries no PII.
      tags: [roster]
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202': {description: Commit accepted.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/UnprocessableEntity'}

  /api/v1/audit-records:
    get:
      operationId: listAuditRecords
      summary: Query audit records (admin or authorized teacher)
      tags: [audit]
      parameters:
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
        - {name: course_id, in: query, required: false, schema: {$ref: './common.yaml#/components/schemas/Uuid'}}
        - {name: from, in: query, required: false, schema: {$ref: './common.yaml#/components/schemas/Timestamp'}}
        - {name: to, in: query, required: false, schema: {$ref: './common.yaml#/components/schemas/Timestamp'}}
      responses:
        '200': {description: Page of audit records.}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}

  /api/v1/modules:
    get:
      operationId: listRegisteredModules
      summary: Runtime module registry (RQ-B-4-40)
      description: |
        Reports the modules the composition host actually loaded, so "plug and play"
        is observable at runtime rather than asserted in prose. The registry content
        must agree with each module's module.yaml and SDK descriptor; a disagreement
        is reported as a failure, never smoothed over.
      tags: [platform]
      responses:
        '200':
          description: Loaded modules and their declared capabilities.
          content:
            application/json:
              schema:
                type: object
                required: [modules]
                properties:
                  modules:
                    type: array
                    items: {$ref: '#/components/schemas/RegisteredModule'}
                additionalProperties: false
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}

  /api/v1/modules/{module}/health:
    parameters:
      - {name: module, in: path, required: true, schema: {type: string, pattern: '^B[0-9]{1,3}$'}}
    get:
      operationId: getModuleHealth
      summary: Per-module health reported through the host
      tags: [platform]
      responses:
        '200': {description: Module health report.}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}

components:
  schemas:
    InternalIdentity:
      type: object
      description: |
        The minimum B2 needs to attach a submission to its owner: a stable id, the student
        number for cross-checking the attachment name, and the display name for the review
        list. No e-mail address is returned (see `lookupIdentityByEmail`).
      required: [user_id, username, display_name, roles, is_active]
      properties:
        user_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        username: {type: string}
        display_name: {type: string}
        student_number: {type: [string, "null"]}
        roles:
          type: array
          items: {$ref: './common.yaml#/components/schemas/Role'}
        is_active: {type: boolean}
      additionalProperties: false

    ClassPublic:
      type: object
      description: |
        One class (班级) inside a section (课序). A class is deliberately not a section: a
        section contains one or more classes, and a course can therefore have several student
        groups in the same 课序 (v0.32.0). `enrollment_count`/`bound_count` are computed over
        the class's active roster rows; `bound_count` is the subset linked to an account.
      required: [class_id, course_id, section_id, class_name, source, enrollment_count, bound_count]
      properties:
        class_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        course_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        section_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        class_name: {type: string, minLength: 1, maxLength: 64}
        source:
          type: string
          enum: [registered_class, roster_import, manual]
          description: "Where the class came from: a registered class (allowlist batch), an uploaded roster file, or manual creation."
        allowlist_batch_id:
          anyOf: [{$ref: './common.yaml#/components/schemas/Uuid'}, {type: "null"}]
          description: "The registration allowlist batch this class was attached from; null for uploaded/manual classes."
        enrollment_count: {type: integer, minimum: 0}
        bound_count: {type: integer, minimum: 0}
        created_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
      additionalProperties: false

    ClassCreate:
      type: object
      description: |
        Create one class inside an existing section. With `batch_id`, the class starts as a
        copy of that registered class's roster (accounts already existing for a student number
        are linked immediately); without it the class starts empty. `class_name` defaults to
        the registered class name (file name without extension) when a batch is given.
      required: [class_name]
      properties:
        class_name: {type: string, minLength: 1, maxLength: 64}
        batch_id: {anyOf: [{$ref: './common.yaml#/components/schemas/Uuid'}, {type: "null"}]}
      additionalProperties: false

    ClassRename:
      type: object
      required: [class_name]
      properties:
        class_name: {type: string, minLength: 1, maxLength: 64}
      additionalProperties: false

    RosterSummary:
      type: object
      description: |
        Server-computed audience counts for one course (v0.32.0). Every number is aggregated
        in SQL over all active enrollments; none of it is summed from a client page, so a
        teacher's "how big is this audience" answer cannot silently depend on pagination.
      required: [course_id, section_count, class_count, student_total, bound_count, unbound_count, sections]
      properties:
        course_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        section_count: {type: integer, minimum: 0}
        class_count: {type: integer, minimum: 0}
        student_total: {type: integer, minimum: 0}
        bound_count: {type: integer, minimum: 0}
        unbound_count: {type: integer, minimum: 0}
        sections:
          type: array
          items:
            type: object
            required: [section_id, section_code, term, class_count, student_total, bound_count, unbound_count, classes]
            properties:
              section_id: {$ref: './common.yaml#/components/schemas/Uuid'}
              section_code: {type: string}
              term: {type: [string, "null"]}
              class_count: {type: integer, minimum: 0}
              student_total: {type: integer, minimum: 0}
              bound_count: {type: integer, minimum: 0}
              unbound_count: {type: integer, minimum: 0}
              classes:
                type: array
                items:
                  type: object
                  required: [class_id, class_name, student_total, bound_count, unbound_count]
                  properties:
                    class_id: {$ref: './common.yaml#/components/schemas/Uuid'}
                    class_name: {type: string}
                    student_total: {type: integer, minimum: 0}
                    bound_count: {type: integer, minimum: 0}
                    unbound_count: {type: integer, minimum: 0}
                  additionalProperties: false
            additionalProperties: false
      additionalProperties: false

    MyMembership:
      type: object
      description: |
        One active course enrollment of the caller, with the section and class they belong to.
        This is what lets a student see "which course, which 课序, which 班级 am I in" and
        switch between several courses; it contains no other student's data.
      required: [course_id, course_title, section_id, section_code, class_id, class_name]
      properties:
        course_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        course_code: {type: [string, "null"]}
        course_title: {type: string}
        section_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        section_code: {type: string}
        term: {type: [string, "null"]}
        class_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        class_name: {type: string}
      additionalProperties: false

    InternalUserAuthorization:
      type: object
      description: |
        Authoritative access facts for one account, read by B3/B2 on every request that decides
        assignment/submission/grade access. Ids only: a name, e-mail address or student number
        must never travel through this internal channel.
      required: [user_id, platform_roles, course_grants, enrollments]
      properties:
        user_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        platform_roles:
          type: array
          items: {$ref: './common.yaml#/components/schemas/Role'}
        course_grants:
          type: array
          description: "Course ids this account is staff (teacher) on."
          items: {$ref: './common.yaml#/components/schemas/Uuid'}
        enrollments:
          type: array
          description: "Active student enrollments: the courses this account may see and submit in, and where."
          items:
            type: object
            required: [course_id, section_id, class_id]
            properties:
              course_id: {$ref: './common.yaml#/components/schemas/Uuid'}
              section_id: {$ref: './common.yaml#/components/schemas/Uuid'}
              class_id: {$ref: './common.yaml#/components/schemas/Uuid'}
            additionalProperties: false
      additionalProperties: false

    AssignmentNotificationRequest:
      type: object
      description: |
        What B3 hands to B4 when an assignment is published. B4 snapshots the course roster
        into recipients; the assignment facts are copied only for the message body (B4 does
        not own assignments and cannot read B3's schema).
      required: [assignment_id, course_id, title, published_at]
      properties:
        assignment_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        course_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        title: {type: string, minLength: 1, maxLength: 200}
        due_at:
          anyOf: [{$ref: './common.yaml#/components/schemas/Timestamp'}, {type: "null"}]
        published_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
      additionalProperties: false

    AssignmentReminderRequest:
      type: object
      description: |
        A one-click reminder to the students who have not submitted yet. The recipient set is
        decided by the caller (the teacher page knows who is missing), but it is not trusted:
        every id must belong to the course's current active roster or the whole request is
        refused with `422`.

        `title` and `due_at` are copied into the message only. B4 does not own assignments and
        cannot read B3's schema, so the page that already has the assignment supplies them --
        exactly like `AssignmentNotificationRequest`. The fixed prompt is composed by the
        server; `note` is the only free text and is appended after it.
      required: [title, enrollment_ids]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        due_at:
          anyOf: [{$ref: './common.yaml#/components/schemas/Timestamp'}, {type: "null"}]
        enrollment_ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: {$ref: './common.yaml#/components/schemas/Uuid'}
        note:
          type: string
          maxLength: 500
          description: "Optional teacher sentence appended after the server-composed prompt."
      additionalProperties: false

    AssignmentNotificationSummary:
      type: object
      description: |
        Delivery counts of one assignment's publication notification. The counts are the
        checked result: `sent_count` counts messages the SMTP server accepted, `failed_count`
        counts attempted deliveries that failed, and the three `skipped_*` counts name the
        students that had no usable channel at publication time. A summary with `sent_count`
        0 and `skipped_unbound_count` > 0 means "nothing was delivered", never "delivered".
      required: [notification_id, kind, assignment_id, course_id, status, recipient_total, sent_count, pending_count, failed_count, skipped_unbound_count, skipped_no_contact_count, skipped_inactive_count, created_at, updated_at]
      properties:
        notification_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        kind:
          type: string
          enum: [publication, reminder]
          description: |
            Which campaign this summary describes. A caller that asked for `reminder` can check
            this field instead of assuming: while an older B4 ignores the `kind` parameter, the
            answer still says `publication`, and the page must not present those rows as the
            reminder's own evidence.
        assignment_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        course_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        status:
          type: string
          enum: [pending, sending, completed, partial, failed]
        recipient_total: {type: integer, minimum: 0}
        sent_count: {type: integer, minimum: 0}
        pending_count: {type: integer, minimum: 0}
        failed_count: {type: integer, minimum: 0}
        skipped_unbound_count: {type: integer, minimum: 0}
        skipped_no_contact_count: {type: integer, minimum: 0}
        skipped_inactive_count: {type: integer, minimum: 0}
        created_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
        updated_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
      additionalProperties: false

    AssignmentNotificationDelivery:
      type: object
      description: |
        One intended recipient of an assignment notification. `student_number`/`display_name`
        are the roster values recorded at publication time, so the row stays meaningful after
        the roster changes. `reason_code`/`reason_detail` explain skipped and failed rows; a
        skipped row is never presented as sent.
      required: [delivery_id, student_number, display_name, section_id, class_id, status, attempts, updated_at]
      properties:
        delivery_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        student_number: {type: string}
        display_name: {type: string}
        section_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        class_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        user_id: {anyOf: [{$ref: './common.yaml#/components/schemas/Uuid'}, {type: "null"}]}
        status:
          type: string
          enum: [pending, sending, sent, failed, skipped_unbound, skipped_no_contact, skipped_inactive]
        reason_code:
          type: [string, "null"]
          enum: [null, smtp_error, mail_not_configured, no_account, no_email, inactive_account]
        reason_detail: {type: [string, "null"], maxLength: 200}
        attempts: {type: integer, minimum: 0}
        sent_at: {anyOf: [{$ref: './common.yaml#/components/schemas/Timestamp'}, {type: "null"}]}
        updated_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
      additionalProperties: false

    EnrollmentPublic:
      type: object
      description: |
        One row of a section's roster. Recorded by CHG-0007: the operation previously
        returned an undocumented body ("Page of enrollments.").

        `student_id` was added by the same change because its absence made a required
        feature impossible: B2's grade rows identify a student only by platform user id,
        while the roster exposed only `student_number`/`display_name` — and B2 legitimately
        cannot supply those (it owns only the `b2` schema, so its `student_number` and
        `display_name` are always null by design). With no shared key, a client could not
        answer "who has not submitted yet" without dumping the admin-only user list.
        `student_id` is the platform user id and is **nullable**: a roster row that was
        never matched to a user account has none (the column is nullable in `b4`).
      required: [enrollment_id, course_id, section_id, class_id, student_number, display_name, is_active]
      properties:
        enrollment_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        course_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        section_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        class_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        class_name: {type: string}
        student_id: {anyOf: [{$ref: './common.yaml#/components/schemas/Uuid'}, {type: "null"}]}
        student_number: {type: string, minLength: 1, maxLength: 64}
        display_name: {type: string, minLength: 1, maxLength: 200}
        is_active: {type: boolean}
        updated_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
      additionalProperties: false

    CurrentUser:
      type: object
      description: |
        The authenticated caller's own account facts (CHG-0032). Deliberately minimal: it exists
        so a student can render the required mail-submission body fields (name/student number)
        without the roster endpoint (staff-only). No e-mail address and no other user's data.
      required: [user_id, username, display_name, roles, memberships]
      properties:
        user_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        username: {type: string}
        display_name: {type: string}
        student_number: {type: [string, "null"]}
        roles:
          type: array
          items: {$ref: './common.yaml#/components/schemas/Role'}
        memberships:
          type: array
          description: |
            The caller's own active course enrollments (v0.32.0), each with its section and
            class. Empty for staff-only accounts. This is how a student can see -- and switch
            between -- every course they belong to without reading a staff-only roster.
          items: {$ref: '#/components/schemas/MyMembership'}
      additionalProperties: false

    UserSummary:
      type: object
      required: [user_id, username, display_name, roles, is_active, updated_at]
      properties:
        user_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        username:
          type: string
          description: "Login identifier. Required in the summary: it is the only field by which an administrator can recognise or look up an account, and an admin screen that cannot show it is unusable (RQ-B-4-50)."
        display_name: {type: string}
        student_number: {type: [string, "null"]}
        roles:
          type: array
          items: {$ref: './common.yaml#/components/schemas/Role'}
        is_active:
          type: boolean
          description: |
            Whether the account may sign in. `deleteUser` is a **soft** deactivation and
            `activateUser` is its soft inverse, so this is the only field that distinguishes a
            deactivated account from a usable one: an admin screen that omits it has no way to
            say whether either `204` actually took effect, and RQ-B-4-50 requires the account
            state to be visible.
        updated_at:
          allOf: [{$ref: './common.yaml#/components/schemas/Timestamp'}]
          description: |
            Last modification. It is the value `updateUser.expected_updated_at` is compared
            against, so it is required here: without it a client can only send a timestamp it
            guessed, and concurrent administrator edits either always conflict or never do.
        created_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
      additionalProperties: false

    AllowlistBatch:
      type: object
      description: |
        One imported allowlist, i.e. one class. `class_name` is derived from the file name: a
        teacher names the file after the class, so there is no second place to type it.
      required: [batch_id, class_name, row_count, uploaded_at]
      properties:
        batch_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        class_name: {type: string}
        filename: {type: string}
        row_count: {type: integer, minimum: 0}
        uploaded_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
      additionalProperties: false

    AllowlistEntry:
      type: object
      required: [entry_id, student_number, display_name]
      properties:
        entry_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        student_number: {type: string}
        display_name: {type: string}
      additionalProperties: false

    CourseRename:
      type: object
      description: |
        Rename request. `title` is the only writable field (see `updateCourse`); an empty or
        whitespace-only title is refused rather than coerced, because a blank course name is
        indistinguishable from a rendering bug later.
      required: [title, expected_updated_at]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        course_code:
          type: [string, "null"]
          description: |
            Optional. **Omitted** leaves the stored code unchanged; `null` (or an empty string)
            clears it. The distinction matters because clearing a label is a deliberate act,
            while a rename that happens not to mention the code must not silently drop it.
        expected_updated_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
      additionalProperties: false

    CoursePublic:
      type: object
      description: |
        A course as the API returns it, for reads and for the create response. The create
        response previously carried only `course_id`, so a client could not show the new
        course without a second round trip.
      required: [course_id, course_code, title, updated_at, section_count]
      properties:
        course_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        course_code:
          type: [string, "null"]
          description: "Optional label; null means the course was created without one."
        #: 该课程下已创建的课序（班级）数量。课程列表直接用它显示"已注册班级数"，
        #: 否则前端要为每一门课再发一次 `listSections`（N+1）。
        section_count: {type: integer, minimum: 0}
        section_codes:
          type: array
          items: {type: string}
          description: "Ordered section codes under this course."
        title: {type: string}
        # `updateCourse.expected_updated_at` is compared against this value: without it a
        # client can only overwrite unconditionally, which makes the lock decorative.
        updated_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
      additionalProperties: false

    SectionPublic:
      type: object
      description: |
        A section (课序) of a course. Defined here because the read and create responses
        had no schema, which forced the client to guess which key carried the identifier
        and which one carried the label.
      required: [section_id, course_id, section_code, enrollment_count]
      properties:
        section_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        course_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        section_code: {type: string, minLength: 1, maxLength: 64}
        term: {type: [string, 'null'], maxLength: 64}
        #: 该课序下的班级（班级）数量。课序与班级自 v0.32.0 起是两个概念：一个课序可含多个班级。
        class_count: {type: integer, minimum: 0}
        #: 该课序下全部班级的有效名单人数。
        enrollment_count: {type: integer, minimum: 0}
        created_at:
          anyOf: [{$ref: './common.yaml#/components/schemas/Timestamp'}, {type: 'null'}]
      additionalProperties: false

    RosterImportPreview:
      type: object
      description: |
        Parse preview for a roster import. `database.schema` of B4 is untouched while
        the import sits in `previewed`. Rows that fail validation appear in `rejected`
        with a reason; they are never dropped silently.
      required: [roster_import_id, status, course_id, section_id, class_id, detected_columns]
      properties:
        roster_import_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        status:
          type: string
          enum: [uploaded, parsed, mapping_required, validating, previewed, committed, rejected, failed_parse]
        course_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        section_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        class_id: {$ref: './common.yaml#/components/schemas/Uuid'}
        detected_columns:
          type: array
          items: {type: string}
        proposed_mapping:
          type: object
          additionalProperties: {type: string}
        accepted_rows:
          type: array
          items: {$ref: '#/components/schemas/RosterRowPreview'}
        rejected_rows:
          type: array
          items: {$ref: '#/components/schemas/RosterRowPreview'}
        created_at: {$ref: './common.yaml#/components/schemas/Timestamp'}
      additionalProperties: false

    RosterRowPreview:
      type: object
      required: [row_number]
      properties:
        row_number: {type: integer, minimum: 1}
        values:
          type: object
          description: "Normalized field values for review. Contains student identity fields; returned only to authorized callers."
          additionalProperties: true
        reason: {type: [string, "null"], description: "Why the row was rejected; required for entries in rejected_rows."}
      additionalProperties: false

    RegisteredModule:
      type: object
      description: "One loaded module as observed at runtime by the composition host."
      required: [module, contract_version, provides, requires, routes, publishes, subscribes, database_schema, migration_head, healthy]
      properties:
        module: {type: string, pattern: '^B[0-9]{1,3}$'}
        contract_version: {type: string}
        provides:
          type: array
          items: {type: string}
        requires:
          type: array
          items: {type: string}
        routes:
          type: array
          items: {type: string, pattern: '^/'}
        publishes:
          type: array
          items: {type: string, pattern: '^autograder\.v1\.'}
        subscribes:
          type: array
          items: {type: string, pattern: '^autograder\.v1\.'}
        database_schema: {type: string, enum: [none, b2, b3, b4]}
        migration_head: {type: string}
        healthy: {type: boolean}
        detail: {type: string}
      additionalProperties: false
