openapi: 3.1.0
info:
  title: AutoGrader common API conventions
  version: 0.22.0
  description: |
    Shared components for the AutoGrader Beta module APIs. Module contracts
    (b2.yaml, b3.yaml, b4.yaml) reference these via external $ref.
    Conventions are documented in MAIN/docs/api/governance.md.
  license:
    name: Course project (internal)
servers:
  - url: /
    description: The composition host serves every module API from the same origin.

paths: {}

components:
  schemas:
    ProblemDetails:
      type: object
      description: |
        RFC 9457 problem details. Never carries stack traces, SQL or internal paths.

        **The status code's meaning is a hard constraint; the order between competing codes is
        not.** Each code keeps exactly one meaning (`governance.md` section 2.2): `401` is
        "not authenticated", `403` is "authenticated but not permitted", `404` is "permitted but
        absent", `422` is "well-formed but semantically invalid". That part is guaranteed.

        When more than one code applies to the same request, **their relative order is not
        guaranteed and consumers must handle each independently.** This is stated rather than
        left implicit because modules genuinely differ here and both ways are defensible: B2 and
        B4 authenticate before validating (B2 defers parameter parsing to its service layer so
        that it has a single Problem Details producer), while B3 lets the framework validate
        first. See `CHG-0021` section 2.6 for the measurements. A client that assumed one order
        would break against the other module.

        Two things *are* ordered and may be relied on:

        * **Route existence and method matching (`404` for an unknown path, `405` for a known
          path with the wrong method) precede both `401` and `422`.** They are routing-layer
          outcomes and depend on no request content. This leaks nothing new: which methods exist
          on which paths is written in this contract.
        * **`403`, `404` (resource absent) and `409` never compete with `401`** -- they are the
          conclusions of an *authenticated* request.
      required: [type, title, status, detail, instance]
      properties:
        type: {type: string, format: uri-reference, examples: ["https://autograder.local/problems/forbidden"]}
        title: {type: string, examples: ["Forbidden"]}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, description: "Request path or trace identifier"}
      additionalProperties: false

    Uuid:
      type: string
      format: uuid
      description: "UUID v4 (RFC 9562), generated by the owning module. See MAIN/docs/api/identifiers.md."

    Timestamp:
      type: string
      format: date-time
      description: "UTC RFC 3339 with millisecond precision, e.g. 2026-09-15T08:30:00.000Z."

    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: "Lowercase hex SHA-256 digest."

    Language:
      type: string
      enum: [python, bash]
      description: "Graded language. Required by RQ-B-0-10; B2 selects the interpreter from this value."

    Role:
      type: string
      enum: [student, teacher, assistant, admin]

    CourseScope:
      type: object
      description: "Authorization scope resolved server-side from the verified token. Never trusted from the client."
      required: [course_id]
      properties:
        course_id: {$ref: '#/components/schemas/Uuid'}
        section_id: {$ref: '#/components/schemas/Uuid'}

    CursorPage:
      type: object
      description: "Cursor pagination envelope. Offset pagination is forbidden for large tables."
      required: [items]
      properties:
        items: {type: array, items: {}}
        next_cursor: {type: [string, "null"]}
      additionalProperties: false

  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema: {type: string}
      description: "W3C Trace Context. Propagated to logs, database records and emitted events."
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: {type: string}
      description: "Correlation identifier. Generated at the entry point when absent."
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, maxLength: 200}
      description: "Alternative to a body-carried idempotency key for create operations."
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}

  securitySchemes:
    # B4 issues short-lived Ed25519 (EdDSA) access tokens; every other module verifies them
    # locally against B4's JWKS (`GET /api/v1/auth/jwks`) and never calls back per request.
    # This declaration is what makes "the API requires a bearer token" machine-checkable
    # instead of a sentence in governance.md: 42 of 43 operations previously carried no
    # `security` at all, so a contract consumer could not tell protected from public.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <EdDSA JWT>`. Claims: `sub` (user id), `roles`, `scope`,
        `iss`/`aud`, `exp`. Verification is local (JWKS), so a revoked session is rejected
        by the module that owns the session, not by signature failure.
    # Service-to-service calls (B2 → B3 evaluation package) use a shared service token
    # instead of a user session: there is no user on whose behalf the call happens.
    serviceToken:
      type: http
      scheme: bearer
      description: |
        Pre-shared service credential for internal endpoints (`tags: [internal]`). Sent as
        the **whole** `Authorization` header value including the `Bearer ` scheme prefix.

  responses:
    BadRequest:
      description: Request could not be parsed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Unauthorized:
      description: Missing, malformed or expired credentials. Does not reveal whether the principal exists.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Forbidden:
      description: Authenticated, but the role or course scope does not permit the operation.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    NotFound:
      description: Authenticated and authorized, but the resource does not exist.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Conflict:
      description: State conflict, e.g. an immutable version, a referenced version or a concurrent edit.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    PayloadTooLarge:
      description: File, aggregate or attachment size limit exceeded.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    UnprocessableEntity:
      description: Schema-valid request rejected by a business rule.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ServiceUnavailable:
      description: A required dependency is unavailable; the response names the dependency.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    BadGateway:
      description: |
        An upstream dependency answered, but not with something this service can use.

        Distinct from `ServiceUnavailable` on purpose: "there is no dependency" and "the
        dependency answered garbage" call for different operator actions, and collapsing them
        would make a malformed model response indistinguishable from an unconfigured
        deployment. The response `type` names the classification and the `detail` never
        contains the upstream body -- an upstream error page can echo the request, which would
        put a user's input into an error message.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
