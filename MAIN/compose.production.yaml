# Production infrastructure only. The composition host runs as a native systemd service
# so nsjail can use a delegated cgroup v2 subtree without a privileged application container.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autograder
      POSTGRES_USER: autograder_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AUTOGRADER_B2_DB_PASSWORD: ${B2_DB_PASSWORD:?B2_DB_PASSWORD is required}
      AUTOGRADER_B3_APP_DB_PASSWORD: ${B3_APP_DB_PASSWORD:?B3_APP_DB_PASSWORD is required}
      AUTOGRADER_B3_INTERNAL_DB_PASSWORD: ${B3_INTERNAL_DB_PASSWORD:?B3_INTERNAL_DB_PASSWORD is required}
      AUTOGRADER_B4_DB_PASSWORD: ${B4_DB_PASSWORD:?B4_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - autograder_production_postgres:/var/lib/postgresql/data
      - ./infra/postgres/initialize-db.sh:/docker-entrypoint-initdb.d/001-autograder-bootstrap.sh:ro
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/.autograder-init.sql:ro
    mem_limit: 96m
    cpus: 0.15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autograder_platform -d autograder"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:25222:4222"
    volumes:
      - autograder_production_nats:/data
    mem_limit: 32m
    cpus: 0.05

volumes:
  autograder_production_postgres:
    name: autograder_production_postgres
  autograder_production_nats:
    name: autograder_production_nats
