[project]
name = "autograder-host"
version = "0.1.0"
description = "AutoGrader composition host"
requires-python = ">=3.12,<3.13"
dependencies = ["autograder-platform==0.1.0", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
autograder-platform = { path = "../sdk" }

[tool.hatch.build.targets.wheel]
packages = ["src/autograder_host"]
