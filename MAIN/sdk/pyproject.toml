[project]
name = "autograder-platform"
version = "0.1.0"
description = "AutoGrader plugin protocol"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autograder_platform"]
