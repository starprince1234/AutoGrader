[project]
name = "autograder-b2"
version = "0.1.0"
description = "AutoGrader submission and evaluation plugin"
requires-python = ">=3.12,<3.13"
dependencies = ["alembic>=1.16,<2", "autograder-platform==0.1.0", "cryptography>=44,<47", "fastapi>=0.115,<1", "jsonschema>=4.23,<5", "nats-py>=2.10,<3", "openpyxl>=3.1,<4", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3", "pyjwt>=2.10,<3", "sqlalchemy>=2.0,<3"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-cov>=6,<7", "pyyaml>=6.0,<7", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.entry-points."autograder.modules"]
b2 = "autograder_b2.plugin:create_module"

[tool.hatch.build.targets.wheel]
packages = ["src/autograder_b2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
autograder-platform = { path = "../MAIN/sdk" }
