<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoGrader 教学评测平台</title>
    <!--
      Icon and theme colour are inlined so the shell makes no extra request and never
      404s: the favicon is a data URI, and the theme colour keeps the browser chrome in
      step with the page background (the Apple-style immersive look). Both track the
      same light/dark switch the stylesheet uses.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071e3'/%3E%3Ctext x='32' y='45' font-family='-apple-system,Helvetica,Arial' font-size='36' font-weight='600' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="可解释、可重放的课程代码评测平台" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
