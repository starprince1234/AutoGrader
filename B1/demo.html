<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoGrader 复核页 · 示例预览</title>
    <style>
      /* 样例页只在开发预览时使用：说明条固定在最上方，业务样式仍然来自 styles.css。 */
      .demo-note {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
        color: #1d2b53;
        background: #eef2ff;
        border-bottom: 1px solid #c7d2fe;
      }
      .demo-note code {
        padding: 1px 6px;
        border-radius: 4px;
        background: #e0e7ff;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="demo-note" role="note">
      <span>
        示例预览（<code>demo.html</code>）：假的登录会话 + 前端 mock 数据，不连接后端，也不会写库。
      </span>
      <span>
        <a href="/app/demo.html?tab=mail">邮件提交</a> ·
        <a href="/app/demo.html?tab=quality">题目质量</a>
      </span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
